<!DOCTYPE html>

<script>
// 0. Web Audio 合成音效引擎
class SoundSynthesizer {
    constructor() { this.ctx = null; this.volume = 0.75; this.muted = false; }
    ensure() {
        if (this.muted || this.volume <= 0) return null;
        if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) this.ctx = new AC(); }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => {});
        return this.ctx;
    }
    playLaunch() {
        const ctx = this.ensure(); if (!ctx) return;
        const now = ctx.currentTime, len = Math.floor(ctx.sampleRate * 0.13);
        const buf = ctx.createBuffer(1, len, ctx.sampleRate), out = buf.getChannelData(0);
        for (let i = 0; i < len; i++) out[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.04));
        const src = ctx.createBufferSource(); src.buffer = buf;
        const flt = ctx.createBiquadFilter(); flt.type = 'bandpass';
        flt.frequency.setValueAtTime(600, now); flt.frequency.exponentialRampToValueAtTime(1700, now + 0.12);
        const g = ctx.createGain(); g.gain.setValueAtTime(0.2 * this.volume, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
        src.connect(flt); flt.connect(g); g.connect(ctx.destination); src.start(now);
    }
    playLaser(isP1 = true) {
        const ctx = this.ensure(); if (!ctx) return;
        const now = ctx.currentTime, osc = ctx.createOscillator(), g = ctx.createGain();
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(isP1 ? 1150 : 1380, now);
        osc.frequency.exponentialRampToValueAtTime(180, now + 0.08);
        g.gain.setValueAtTime(0.16 * this.volume, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        osc.connect(g); g.connect(ctx.destination); osc.start(now); osc.stop(now + 0.085);
    }
    playHitValid() {
        const ctx = this.ensure(); if (!ctx) return;
        const now = ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.5].forEach((f, idx) => {
            const osc = ctx.createOscillator(), g = ctx.createGain(), t = now + idx * 0.018;
            osc.type = idx === 3 ? 'triangle' : 'sine'; osc.frequency.setValueAtTime(f, t);
            g.gain.setValueAtTime(0.001, t); g.gain.linearRampToValueAtTime((0.17 - idx * 0.03) * this.volume, t + 0.01);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
            osc.connect(g); g.connect(ctx.destination); osc.start(t); osc.stop(t + 0.31);
        });
    }
    playScoreFlash() {
        const ctx = this.ensure(); if (!ctx) return;
        const now = ctx.currentTime;
        [880, 1174.66, 1318.51].forEach((f, idx) => {
            const osc = ctx.createOscillator(), g = ctx.createGain(), t = now + idx * 0.035;
            osc.type = 'triangle'; osc.frequency.setValueAtTime(f, t);
            g.gain.setValueAtTime(0.14 * this.volume, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
            osc.connect(g); g.connect(ctx.destination); osc.start(t); osc.stop(t + 0.19);
        });
    }
    playHitWrong() {
        const ctx = this.ensure(); if (!ctx) return;
        const now = ctx.currentTime;
        [285, 438, 692].forEach(f => {
            const osc = ctx.createOscillator(), g = ctx.createGain();
            osc.type = 'square'; osc.frequency.setValueAtTime(f, now);
            osc.frequency.exponentialRampToValueAtTime(f * 0.86, now + 0.22);
            g.gain.setValueAtTime(0.1 * this.volume, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
            osc.connect(g); g.connect(ctx.destination); osc.start(now); osc.stop(now + 0.23);
        });
    }
}
const sfx = new SoundSynthesizer();

// 1. 1-Euro Filter 自适应滤波器
class LowPassFilter {
    constructor() { this.y = null; this.s = null; }
    filter(v, a) { this.s = this.y === null ? v : a * v + (1 - a) * this.s; this.y = v; return this.s; }
    reset(v = null) { this.y = v; this.s = v; }
}
class OneEuroFilter {
    constructor(minCutoff = 1.0, beta = 0.007, dCutoff = 1.0) {
        this.minCutoff = minCutoff; this.beta = beta; this.dCutoff = dCutoff;
        this.xF = new LowPassFilter(); this.dxF = new LowPassFilter(); this.lastTime = null;
    }
    alpha(cutoff, dt) { const tau = 1 / (2 * Math.PI * cutoff); return 1 / (1 + tau / dt); }
    filter(v, ts = performance.now() / 1000) {
        let dt = 1 / 60;
        if (this.lastTime !== null && ts - this.lastTime > 0.001 && ts - this.lastTime < 0.2) dt = ts - this.lastTime;
        this.lastTime = ts;
        const dv = this.xF.y !== null ? (v - this.xF.y) / dt : 0;
        const edv = this.dxF.filter(dv, this.alpha(this.dCutoff, dt));
        const cutoff = this.minCutoff + this.beta * Math.abs(edv);
        return this.xF.filter(v, this.alpha(cutoff, dt));
    }
    reset(v = null) { this.xF.reset(v); this.dxF.reset(0); this.lastTime = null; }
}

// 2. 全局状态与题库配置
const CONFIG = {
    speedScale: 0.80, apexDamping: 0.75, spawnInterval: 2.2,
    reticleSensitivity: 0.6, baseGyroSensitivity: 0.0018, gyroAccelExponent: 1.20,
    gyroStaticDeadzone: 12, oneEuroMinCutoff: 1.0, oneEuroBeta: 0.007, oneEuroDCutoff: 1.0,
    invertGyroX: false, invertGyroY: false
};

const PRESET_LEVELS = [
    { base: '电', validRaw: '脑:电脑, 话:电话, 影:电影, 视:电视, 池:电池, 梯:电梯, 源:电源, 流:电流, 子:电子, 车:电车', invalidRaw: '鱼, 木, 水, 草, 石, 狗, 羊, 鸟, 土, 米' },
    { base: '水', validRaw: '果:水果, 平:水平, 晶:水晶, 滴:水滴, 杯:水杯, 库:水库, 泥:水泥, 手:水手, 稻:水稻, 源:水源', invalidRaw: '火, 山, 刀, 车, 日, 月, 木, 石, 布, 金' },
    { base: '机', validRaw: '飞:飞机, 手:手机, 器:机器, 会:机会, 司:司机, 关:机关, 密:机密, 场:机场, 智:机智, 危:危机', invalidRaw: '草, 羊, 牛, 鱼, 瓜, 豆, 云, 雨, 雪, 泥' }
];

let currentPresetIdx = 0, activeWordBank = { base: '电', validList: [], invalidList: [] };
let canvas, ctx, width = window.innerWidth, height = window.innerHeight;
const frisbees = [], discSectorShards = [], shockwaveRings = [], launcherRings = [], flyingTokens = [], particles = [], floatingTexts = [];
const launchers = [{ side: 'left', recoil: 0, angle: -Math.PI * 0.34 }, { side: 'right', recoil: 0, angle: -Math.PI * 0.66 }];
const RACK_SLOT_COUNT = 4;

const players = [
    {
        id: 1, name: 'P1', x: 0, y: 0, rawX: 0, rawY: 0,
        filterX: new OneEuroFilter(1.0, 0.007, 1.0), filterY: new OneEuroFilter(1.0, 0.007, 1.0),
        color: '#facc15', accentColor: '#fef08a', rackBg: 'rgba(250,204,21,0.10)',
        score: 0, hp: 8, maxHp: 8, damageFlash: 0, scoreFlashTimer: 0,
        cooldown: 0, maxCooldown: 2.0, firePulse: 0, isLocked: false, hasJoyCon: false, collectedWords: []
    },
    {
        id: 2, name: 'P2', x: 0, y: 0, rawX: 0, rawY: 0,
        filterX: new OneEuroFilter(1.0, 0.007, 1.0), filterY: new OneEuroFilter(1.0, 0.007, 1.0),
        color: '#d946ef', accentColor: '#f5d0fe', rackBg: 'rgba(217,70,239,0.10)',
        score: 0, hp: 8, maxHp: 8, damageFlash: 0, scoreFlashTimer: 0,
        cooldown: 0, maxCooldown: 2.0, firePulse: 0, isLocked: false, hasJoyCon: false, collectedWords: []
    }
];

const keys = { w: false, a: false, s: false, d: false };
const P2_SPEED = 650;

function getPlayerRackGeometry(idx) {
    const rackW = 148, rackH = 224, rackX = idx === 0 ? 20 : width - 20 - rackW, rackY = 184;
    const slotW = rackW - 20, slotH = 42, slotStartX = rackX + 10, slotStartY = rackY + 34, slotGap = 46;
    return {
        rackX, rackY, rackW, rackH, slotW, slotH,
        getSlotCenter(sIdx) {
            const c = Math.max(0, Math.min(RACK_SLOT_COUNT - 1, sIdx));
            return { x: slotStartX + slotW / 2, y: slotStartY + c * slotGap + slotH / 2 };
        },
        getSlotRect(sIdx) { return { x: slotStartX, y: slotStartY + sIdx * slotGap, w: slotW, h: slotH }; }
    };
}

function recenterPlayerReticle(idx, toast = true) {
    const p = players[idx]; if (!p) return;
    p.rawX = p.x = width / 2; p.rawY = p.y = height / 2;
    p.filterX.reset(p.x); p.filterY.reset(p.y);
    if (toast) floatingTexts.push(new FloatingText(p.x, p.y - 28, `🎯 ${p.name} 准星已归中`, p.color));
}

function syncReticleSensitivityToFilters() {
    const s = CONFIG.reticleSensitivity;
    players.forEach(p => {
        p.filterX.minCutoff = p.filterY.minCutoff = CONFIG.oneEuroMinCutoff * (0.7 + 0.5 * s);
        p.filterX.beta = p.filterY.beta = CONFIG.oneEuroBeta * (0.75 + 0.4 * s);
    });
}

function parseAndApplyWordBank(baseStr, validStr, invalidStr) {
    const cleanBase = (baseStr || '').trim() || '字';
    const parsedValid = [];
    validStr.split(/[,，\n]+/).map(s => s.trim()).filter(Boolean).forEach(item => {
        const parts = item.split(/[:：]/).map(s => s.trim()).filter(Boolean);
        if (parts.length >= 2) parsedValid.push({ char: parts[0][0], word: parts[1] });
        else if (parts.length === 1) parsedValid.push({ char: parts[0][0], word: cleanBase + parts[0][0] });
    });
    if (!parsedValid.length) parsedValid.push({ char: '光', word: cleanBase + '光' });
    const parsedInvalid = invalidStr.split(/[,，\s\n]+/).map(s => s.trim()).filter(Boolean).map(s => s[0]);
    if (!parsedInvalid.length) parsedInvalid.push('✕');

    activeWordBank = { base: cleanBase, validList: parsedValid, invalidList: parsedInvalid };
    frisbees.length = 0; discSectorShards.length = 0; shockwaveRings.length = 0; flyingTokens.length = 0;
    players.forEach(p => { p.collectedWords = []; p.hp = p.maxHp; });
    if (width && height) floatingTexts.push(new FloatingText(width / 2, 145, `✨ 已切换母字【${cleanBase}】`, '#38bdf8'));
}

function loadPresetToForm(index) {
    currentPresetIdx = index;
    const p = PRESET_LEVELS[index];
    document.getElementById('input-base').value = p.base;
    document.getElementById('input-valid').value = p.validRaw;
    document.getElementById('input-invalid').value = p.invalidRaw;
    document.querySelectorAll('.preset-btn').forEach((b, i) => b.classList.toggle('active', i === index));
    parseAndApplyWordBank(p.base, p.validRaw, p.invalidRaw);
}

// 3. Joy-Con WebHID 驱动层
class JoyConHIDManager {
    constructor() {
        this.controllers = [null, null];
        if ('hid' in navigator) navigator.hid.addEventListener('disconnect', e => this.handleDisconnect(e.device));
    }
    sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
    async sendSubcommand(ctrl, subcmd, args = []) {
        const payload = new Uint8Array(48);
        payload[0] = ctrl.packetCounter & 0x0f;
        ctrl.packetCounter = (ctrl.packetCounter + 1) & 0x0f;
        payload.set([0x00, 0x01, 0x40, 0x40, 0x00, 0x01, 0x40, 0x40], 1);
        payload[9] = subcmd;
        args.forEach((v, i) => payload[10 + i] = v);
        await ctrl.device.sendReport(0x01, payload);
    }
    async requestConnection() {
        if (!('hid' in navigator)) { alert('请使用 Chrome 或 Edge 浏览器以支持 WebHID。'); return; }
        try {
            const devs = await navigator.hid.requestDevice({
                filters: [{ vendorId: 0x057e, productId: 0x2006 }, { vendorId: 0x057e, productId: 0x2007 }, { vendorId: 0x057e, productId: 0x2009 }]
            });
            for (const d of devs) await this.attachDevice(d);
        } catch (e) { console.error(e); }
    }
    async attachDevice(device) {
        if (this.controllers.some(c => c && c.device === device)) return;
        const slot = !this.controllers[0] ? 0 : (!this.controllers[1] ? 1 : -1);
        if (slot === -1) return;
        if (!device.opened) await device.open();
        const ctrl = {
            device, isLeft: device.productId === 0x2006, packetCounter: 0,
            lastFire: false, lastRecenter: false, biasYaw: 0, biasPitch: 0, stillFrames: 0, accumY: 0, accumP: 0, listener: null
        };
        this.controllers[slot] = ctrl; players[slot].hasJoyCon = true;
        recenterPlayerReticle(slot, false);
        ctrl.listener = e => this.handleInput(slot, ctrl, e);
        device.addEventListener('inputreport', ctrl.listener);
        await this.sendSubcommand(ctrl, 0x40, [0x01]); await this.sleep(60);
        await this.sendSubcommand(ctrl, 0x03, [0x30]); await this.sleep(60);
        await this.sendSubcommand(ctrl, 0x30, [slot === 0 ? 0x01 : 0x03]);
        this.updateBtn();
    }
    handleDisconnect(device) {
        const idx = this.controllers.findIndex(c => c && c.device === device);
        if (idx === -1) return;
        this.controllers[idx] = null; players[idx].hasJoyCon = false;
        if (idx === 0 && this.controllers[1]) {
            const rem = this.controllers[1]; this.controllers[0] = rem; this.controllers[1] = null;
            players[0].hasJoyCon = true; players[1].hasJoyCon = false;
            rem.device.removeEventListener('inputreport', rem.listener);
            rem.listener = e => this.handleInput(0, rem, e);
            rem.device.addEventListener('inputreport', rem.listener);
        }
        this.updateBtn();
    }
    updateBtn() {
        const n = this.controllers.filter(Boolean).length;
        document.getElementById('btn-joycon').innerText = n === 0 ? '🎮 连接 Joy-Con' : (n === 1 ? '🎮 已连接(1/2) 再点连P2' : '🎮 双手柄已就绪(2/2)');
    }
    handleInput(pIdx, ctrl, event) {
        const { data, reportId } = event;
        if (reportId !== 0x30 || data.byteLength < 25) return;
        const p = players[pIdx];
        const rB = data.getUint8(2), sB = data.getUint8(3), lB = data.getUint8(4);
        const fire = (rB & 0xc0) !== 0 || (lB & 0xc0) !== 0;
        if (fire && !ctrl.lastFire) triggerFire(pIdx);
        ctrl.lastFire = fire;
        const recenter = (sB & 0x3f) !== 0;
        if (recenter && !ctrl.lastRecenter) { recenterPlayerReticle(pIdx, true); return; }
        ctrl.lastRecenter = recenter;

        const frames = data.byteLength >= 48 ? 3 : 1;
        let sumP = 0, sumY = 0;
        for (let i = 0; i < frames; i++) {
            sumP += data.getInt16(20 + i * 12, true);
            sumY += data.getInt16(22 + i * 12, true);
        }
        const rawP = sumP / frames, rawY = sumY / frames, dz = CONFIG.gyroStaticDeadzone;
        if (Math.abs(rawY - ctrl.biasYaw) < dz && Math.abs(rawP - ctrl.biasPitch) < dz && Math.abs(rawY) < 65 && Math.abs(rawP) < 65) {
            ctrl.stillFrames++; ctrl.accumY += rawY; ctrl.accumP += rawP;
            if (ctrl.stillFrames >= 30) {
                ctrl.biasYaw = ctrl.accumY / ctrl.stillFrames; ctrl.biasPitch = ctrl.accumP / ctrl.stillFrames;
                ctrl.stillFrames = 0; ctrl.accumY = 0; ctrl.accumP = 0;
            }
        } else { ctrl.stillFrames = 0; ctrl.accumY = 0; ctrl.accumP = 0; }

        let calY = rawY - ctrl.biasYaw, calP = rawP - ctrl.biasPitch;
        if (Math.abs(calY) < dz) calY = 0;
        if (Math.abs(calP) < dz) calP = 0;

        const vYaw = calY * (CONFIG.invertGyroX ? -1 : 1);
        const vPitch = calP * (CONFIG.invertGyroY ? -1 : 1) * (ctrl.isLeft ? 1 : -1);
        const exp = CONFIG.gyroAccelExponent, sens = CONFIG.baseGyroSensitivity * CONFIG.reticleSensitivity;
        p.rawX = Math.max(0, Math.min(width, p.rawX + Math.sign(vYaw) * Math.pow(Math.abs(vYaw), exp) * sens));
        p.rawY = Math.max(0, Math.min(height, p.rawY + Math.sign(vPitch) * Math.pow(Math.abs(vPitch), exp) * sens));
        const now = performance.now() / 1000;
        p.x = Math.max(0, Math.min(width, p.filterX.filter(p.rawX, now)));
        p.y = Math.max(0, Math.min(height, p.filterY.filter(p.rawY, now)));
    }
}

// 4. 街头工业风飞盘绘制
function renderDiscFaceGraphic(ctx, R, isValid, themeVariant, angle, char) {
    ctx.save(); ctx.rotate(angle);
    if (isValid) {
        const isYT = themeVariant === 0;
        const rimG = ctx.createRadialGradient(-R * 0.25, -R * 0.25, R * 0.45, 0, 0, R);
        if (isYT) { rimG.addColorStop(0, '#fef08a'); rimG.addColorStop(0.55, '#eab308'); rimG.addColorStop(0.88, '#ca8a04'); rimG.addColorStop(1, '#713f12'); }
        else { rimG.addColorStop(0, '#fdba74'); rimG.addColorStop(0.55, '#f97316'); rimG.addColorStop(0.88, '#c2410c'); rimG.addColorStop(1, '#431407'); }
        ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fillStyle = rimG; ctx.fill();
        ctx.lineWidth = 3; ctx.strokeStyle = '#090d16'; ctx.stroke();

        const innerR = R * 0.72;
        const coreG = ctx.createRadialGradient(-innerR * 0.2, -innerR * 0.2, innerR * 0.1, 0, 0, innerR);
        if (isYT) { coreG.addColorStop(0, '#5eead4'); coreG.addColorStop(0.6, '#14b8a6'); coreG.addColorStop(1, '#0f766e'); }
        else { coreG.addColorStop(0, '#ea580c'); coreG.addColorStop(0.65, '#9a3412'); coreG.addColorStop(1, '#1e293b'); }
        ctx.beginPath(); ctx.arc(0, 0, innerR, 0, Math.PI * 2); ctx.fillStyle = coreG; ctx.fill();
        ctx.lineWidth = 2.5; ctx.strokeStyle = '#090d16'; ctx.stroke();
    } else {
        const mG = ctx.createRadialGradient(-R * 0.3, -R * 0.3, R * 0.2, 0, 0, R);
        mG.addColorStop(0, '#64748b'); mG.addColorStop(0.6, '#334155'); mG.addColorStop(1, '#090d16');
        ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fillStyle = mG; ctx.fill();
        ctx.lineWidth = 3; ctx.strokeStyle = '#090d16'; ctx.stroke();

        const hMid = R * 0.72, hW = R * 0.14;
        ctx.beginPath(); ctx.arc(0, 0, hMid, 0, Math.PI * 2); ctx.strokeStyle = '#eab308'; ctx.lineWidth = hW; ctx.stroke();
        ctx.strokeStyle = '#111827'; ctx.lineWidth = hW + 1;
        for (let i = 0; i < 18; i++) {
            const a = i * (Math.PI * 2 / 18);
            ctx.beginPath(); ctx.arc(0, 0, hMid, a, a + 0.18); ctx.stroke();
        }
        ctx.beginPath(); ctx.arc(0, 0, R * 0.65, 0, Math.PI * 2); ctx.fillStyle = '#273244'; ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = '#090d16'; ctx.stroke();
    }
    ctx.restore();

    ctx.save();
    ctx.beginPath(); ctx.arc(0, 0, R - 4, -Math.PI * 0.82, -Math.PI * 0.18);
    ctx.strokeStyle = isValid ? 'rgba(255,255,255,0.55)' : 'rgba(226,232,240,0.35)';
    ctx.lineWidth = 3.5; ctx.lineCap = 'round'; ctx.stroke();
    ctx.restore();

    ctx.save();
    ctx.font = `900 ${Math.round(R * 1.2)}px "PingFang SC", "Microsoft YaHei", sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    if (isValid) {
        if (themeVariant === 0) {
            ctx.lineWidth = 10; ctx.strokeStyle = '#ffffff'; ctx.strokeText(char, 0, 3);
            ctx.lineWidth = 5; ctx.strokeStyle = '#090d16'; ctx.strokeText(char, 0, 3);
            ctx.fillStyle = '#18181b'; ctx.fillText(char, 0, 3);
        } else {
            ctx.lineWidth = 9; ctx.strokeStyle = '#090d16'; ctx.strokeText(char, 0, 3);
            ctx.fillStyle = '#fef08a'; ctx.fillText(char, 0, 3);
        }
    } else {
        ctx.lineWidth = 8; ctx.strokeStyle = '#090d16'; ctx.strokeText(char, 0, 3);
        ctx.fillStyle = '#64748b'; ctx.fillText(char, 0, 3);
    }
    ctx.restore();
}

function drawDisc(ctx, disc) {
    const R = disc.radius, scaleY = 1.0 - 0.18 * Math.min(1.0, Math.abs(disc.normVy) / 310);
    ctx.save(); ctx.translate(disc.x, disc.y); ctx.scale(1.0, scaleY);
    const lip = (1.0 - scaleY) * 28 + 3.5;
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 6;
    ctx.beginPath(); ctx.arc(0, lip, R, 0, Math.PI * 2);
    ctx.fillStyle = !disc.isValid ? '#0f141c' : (disc.themeVariant === 0 ? '#3f4d08' : '#571f06');
    ctx.fill(); ctx.restore();

    renderDiscFaceGraphic(ctx, R, disc.isValid, disc.themeVariant, disc.angle, disc.char);

    if (disc.hitStopFrames > 0) {
        ctx.save(); ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.clip();
        ctx.fillStyle = 'rgba(255,255,255,0.28)'; ctx.fillRect(-R, -R, R * 2, R * 2);
        ctx.strokeStyle = '#090d16'; ctx.lineWidth = 5;
        [-0.72, 0.82, 2.38, -2.28].forEach((a, i) => {
            ctx.beginPath(); ctx.moveTo(0, 0);
            ctx.lineTo(Math.cos(a + (i % 2 ? 0.15 : -0.15)) * (R * 0.45), Math.sin(a + (i % 2 ? 0.15 : -0.15)) * (R * 0.45));
            ctx.lineTo(Math.cos(a) * (R + 4), Math.sin(a) * (R + 4)); ctx.stroke();
        });
        ctx.restore();
    }
    ctx.restore();
}

// 5. 实体类
class Frisbee {
    constructor(forceLeft = null) {
        this.radius = 52;
        this.fromLeft = forceLeft !== null ? forceLeft : Math.random() < 0.5;
        this.x = this.fromLeft ? 74 : width - 74; this.y = height - 68;
        const apexX = width * (0.26 + Math.random() * 0.48), apexY = height * (0.18 + Math.random() * 0.24);
        this.baseGravity = 220;
        this.baseVy = -Math.sqrt(2 * this.baseGravity * (this.y - apexY));
        this.baseVx = (apexX - this.x) / (-this.baseVy / this.baseGravity);
        this.normVx = this.baseVx; this.normVy = this.baseVy;
        this.isValid = Math.random() < 0.65; this.themeVariant = Math.random() < 0.55 ? 0 : 1;
        if (this.isValid) {
            const it = activeWordBank.validList[Math.floor(Math.random() * activeWordBank.validList.length)];
            this.char = it.char; this.fullWord = it.word;
        } else {
            const ch = activeWordBank.invalidList[Math.floor(Math.random() * activeWordBank.invalidList.length)];
            this.char = ch; this.fullWord = activeWordBank.base + ch;
        }
        this.angle = Math.random() * Math.PI * 2;
        this.baseSpinSpeed = (this.fromLeft ? 1 : -1) * (1.2 + Math.random());
        this.markedForDeletion = false; this.hitStopFrames = 0; this.hitStopTimer = 0; this.hitByPlayerIndex = -1;
    }
    update(dt) {
        if (this.hitStopFrames > 0) {
            this.hitStopTimer -= dt; this.hitStopFrames--;
            if (this.hitStopFrames <= 0 || this.hitStopTimer <= 0) { shatterDiscAfterHitStop(this); this.markedForDeletion = true; }
            return;
        }
        let apexScale = 1.0;
        if (Math.abs(this.normVy) < 165) {
            const minS = Math.max(0.08, 1.0 - CONFIG.apexDamping);
            apexScale = minS + (1.0 - minS) * Math.pow(Math.abs(this.normVy) / 165, 2);
        }
        const effDt = dt * CONFIG.speedScale * apexScale;
        this.x += this.normVx * effDt; this.y += this.normVy * effDt;
        this.normVy += this.baseGravity * effDt; this.angle += this.baseSpinSpeed * effDt;
        if (this.y > height + this.radius + 50 && this.normVy > 0) this.markedForDeletion = true;
    }
    draw(ctx) { drawDisc(ctx, this); }
}

class LauncherMuzzleRing {
    constructor(x, y, a) {

        this.x += this.vx * dt * (1 - p * 0.6); this.y += this.vy * dt * (1 - p * 0.6);
        this.radius = 12 + 26 * (1 - Math.pow(1 - p, 2)); this.alpha = 0.85 * (1 - p);

    draw(ctx) {
        if (this.alpha <= 0.01) return;

class DiscSectorShard {
    constructor(disc, qIdx) {
        this.x = disc.x; this.y = disc.y; this.radius = disc.radius;
        this.isValid = disc.isValid; this.themeVariant = disc.themeVariant;
        this.discAngle = disc.angle; this.char = disc.char;
        this.startAngle = qIdx * (Math.PI / 2) - Math.PI * 0.22;
        this.endAngle = this.startAngle + Math.PI / 2;
        const mid = (this.startAngle + this.endAngle) / 2, spd = 135 + Math.random() * 80;
        this.vx = Math.cos(mid) * spd; this.vy = Math.sin(mid) * spd - 35;
        this.gravity = 380; this.shardRotation = 0; this.rotSpeed = (qIdx % 2 === 0 ? 1 : -1) * 2.8;
        this.x += Math.cos(mid) * 5; this.y += Math.sin(mid) * 5;
        this.alpha = 1.0; this.decay = 1.55;
    }
    update(dt) {
        this.x += this.vx * dt; this.y += this.vy * dt; this.vy += this.gravity * dt;
        this.shardRotation += this.rotSpeed * dt; this.alpha -= this.decay * dt;
    }
    draw(ctx) {
        if (this.alpha <= 0) return;
        const R = this.radius;
        ctx.save(); ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.translate(this.x, this.y); ctx.rotate(this.shardRotation);
        ctx.beginPath(); ctx.moveTo(0, 0);
        ctx.arc(0, 0, R + 3, this.startAngle, this.endAngle, false); ctx.closePath();
        ctx.save(); ctx.clip();
        renderDiscFaceGraphic(ctx, R, this.isValid, this.themeVariant, this.discAngle, this.char);
        ctx.restore();
        ctx.strokeStyle = '#090d16'; ctx.lineWidth = 2.5; ctx.stroke(); ctx.restore();

class FlyingPhraseToken {
    constructor(sx, sy, word, pIdx) {
        this.playerIndex = pIdx; this.player = players[pIdx]; this.fullWord = word;
        this.startX = sx; this.startY = sy; this.x = sx; this.y = sy;
        this.targetSlotIdx = Math.min(RACK_SLOT_COUNT - 1, this.player.collectedWords.length);
        this.elapsed = 0; this.holdDuration = 0.16; this.flyDuration = 0.52; this.scale = 0.5; this.finished = false;
    }
    update(dt) {
        this.elapsed += dt;
        const target = getPlayerRackGeometry(this.playerIndex).getSlotCenter(this.targetSlotIdx);
        if (this.elapsed <= this.holdDuration) {
            const t = this.elapsed / this.holdDuration;
            this.scale = 0.6 + 0.52 * Math.sin(t * Math.PI * 0.65);
            this.x = this.startX; this.y = this.startY - t * 12;
        } else {
            const rawT = Math.min(1, (this.elapsed - this.holdDuration) / this.flyDuration);
            const easeT = rawT < 0.5 ? 4 * rawT * rawT * rawT : 1 - Math.pow(-2 * rawT + 2, 3) / 2;
            const p0x = this.startX, p0y = this.startY - 12, p2x = target.x, p2y = target.y;
            const p1x = (p0x + p2x) * 0.5, p1y = Math.min(p0y, p2y) - 95, inv = 1 - easeT;
            this.x = inv * inv * p0x + 2 * inv * easeT * p1x + easeT * easeT * p2x;
            this.y = inv * inv * p0y + 2 * inv * easeT * p1y + easeT * easeT * p2y;
            this.scale = 1.12 - 0.12 * easeT;
            if (rawT >= 1 && !this.finished) {
                this.finished = true; this.player.score += 100; this.player.scoreFlashTimer = 0.40;
                sfx.playScoreFlash();
                if (this.player.collectedWords.length >= RACK_SLOT_COUNT) this.player.collectedWords.shift();
                this.player.collectedWords.push({ word: this.fullWord, flash: 1.0 });
            }
        }
    }
    draw(ctx) {
        ctx.save(); ctx.translate(this.x, this.y); ctx.scale(this.scale, this.scale);
        drawPhraseBadgeGraphic(ctx, 128, 40, this.fullWord, this.playerIndex, 1.0); ctx.restore();
    }
}

function drawPhraseBadgeGraphic(ctx, w, h, wordText, pIdx, flash = 0) {

class ShardParticle {

function shatterDiscAfterHitStop(disc) {
    for (let q = 0; q < 4; q++) discSectorShards.push(new DiscSectorShard(disc, q));
    const cols = disc.themeVariant === 0 ? ['#eab308', '#14b8a6'] : ['#f97316', '#2dd4bf'];
    for (let i = 0; i < 8; i++) particles.push(new ShardParticle(disc.x, disc.y, cols[i % 2]));
    shockwaveRings.push(new ShockwaveRing(disc.x, disc.y));
    if (disc.hitByPlayerIndex >= 0) {
        players[disc.hitByPlayerIndex].scoreFlashTimer = 0.40;
        flyingTokens.push(new FlyingPhraseToken(disc.x, disc.y, disc.fullWord, disc.hitByPlayerIndex));

function triggerFire(pIdx) {
    const p = players[pIdx]; if (p.cooldown > 0) return;
    p.firePulse = 1.0; sfx.playLaser(pIdx === 0);
    for (let i = frisbees.length - 1; i >= 0; i--) {
        const f = frisbees[i]; if (f.hitStopFrames > 0) continue;
        if (Math.hypot(p.x - f.x, p.y - f.y) <= f.radius + 4) {
            if (f.isValid) {
                sfx.playHitValid(); f.hitStopFrames = 3; f.hitStopTimer = 0.05; f.hitByPlayerIndex = pIdx;
            } else {
                sfx.playHitWrong(); p.cooldown = p.maxCooldown; p.hp = Math.max(1, p.hp - 1);
                for (let q = 0; q < 4; q++) discSectorShards.push(new DiscSectorShard(f, q));
                shockwaveRings.push(new ShockwaveRing(f.x, f.y));
                floatingTexts.push(new FloatingText(f.x, f.y - 10, `✗ 误击【${f.char}】 HP-1 & 冷却!`, '#f87171'));
                frisbees.splice(i, 1);
            }
            break;
        }
    }
}

function drawPlayerScoreAndHealthHUD(ctx, pIdx) {

    const bridgeX = isP1 ? badgeX + badgeW - 2 : badgeX - bridgeW + 2;
    const stackX = isP1 ? bridgeX + bridgeW - 2 : bridgeX - stackW + 2;

    ctx.save();
    ctx.fillStyle = '#1e293b'; ctx.strokeStyle = '#090d16'; ctx.lineWidth = 2;
    ctx.fillRect(bridgeX, topY + 18, bridgeW, badgeH - 36); ctx.strokeRect(bridgeX, topY + 18, bridgeW, badgeH - 36);

    // 方形金属徽章框
    traceChamferRect(ctx, badgeX, topY, badgeW, badgeH, 9);
    ctx.fillStyle = '#334155'; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = '#090d16'; ctx.stroke();
    ctx.fillStyle = theme; ctx.fillRect(badgeX + 18, topY + 1, badgeW - 36, 3); ctx.fillRect(badgeX + 16, topY + badgeH - 4, badgeW - 32, 3);

    traceChamferRect(ctx, badgeX + 6, topY + 6, badgeW - 12, badgeH - 12, 6);
    ctx.fillStyle = isP1 ? '#262f26' : '#281d33'; ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = theme; ctx.stroke();
    drawMetalFastener(ctx, badgeX + 12, topY + 12, 3.5, theme); drawMetalFastener(ctx, badgeX + badgeW - 12, topY + 12, 3.5, theme);
    drawMetalFastener(ctx, badgeX + 12, topY + badgeH - 12, 3.5, theme); drawMetalFastener(ctx, badgeX + badgeW - 12, topY + badgeH - 12, 3.5, theme);

    ctx.strokeStyle = theme; ctx.lineWidth = 1.2;
    for (let t = 0; t < 5; t++) {
        const ty = topY + 34 + t * 5;
        ctx.beginPath(); ctx.moveTo(badgeX + 10, ty); ctx.lineTo(badgeX + 14, ty);
        ctx.moveTo(badgeX + badgeW - 14, ty); ctx.lineTo(badgeX + badgeW - 10, ty); ctx.stroke();
    }

    ctx.save(); ctx.shadowColor = theme; ctx.shadowBlur = 10; ctx.fillStyle = theme;
    ctx.font = '900 40px "Arial Black", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(p.name, badgeX + badgeW / 2, topY + 46); ctx.restore();
    drawHazardStripeBar(ctx, badgeX + 18, topY + badgeH - 22, badgeW - 36, 9, theme);

    // 上层托盘：8格分段式生命槽
    traceChamferRect(ctx, stackX, topY, stackW, lifeH, 8);
    ctx.fillStyle = isLow ? '#3b1d24' : '#334155'; ctx.fill();
    ctx.lineWidth = 2.2; ctx.strokeStyle = isLow ? '#ef4444' : '#090d16'; ctx.stroke();
    ctx.beginPath(); ctx.roundRect(stackX + 6, topY + 6, stackW - 12, lifeH - 12, 5);
    ctx.fillStyle = '#090d16'; ctx.fill();

    const segW = 16, segH = 25, segGap = 4.5, segStartX = stackX + 13, segY = topY + (lifeH - segH) / 2;
    for (let i = 0; i < 8; i++) {
        if (isLow && i >= 6) continue;
        const sx = segStartX + i * (segW + segGap);
        if (i < p.hp) {
            ctx.save();
            ctx.fillStyle = isLow ? '#f97316' : theme;
            ctx.shadowColor = isLow ? '#ef4444' : theme; ctx.shadowBlur = 8;
            ctx.beginPath(); ctx.roundRect(sx, segY, segW, segH, 3); ctx.fill();
            ctx.restore();
        } else {
            ctx.fillStyle = '#161e2e'; ctx.strokeStyle = '#334155'; ctx.lineWidth = 1;
            ctx.beginPath(); ctx.roundRect(sx, segY, segW, segH, 3); ctx.fill(); ctx.stroke();
        }
    }
    if (isLow) {
        ctx.save(); ctx.globalAlpha = 0.65 + 0.35 * blink; ctx.fillStyle = '#ef4444'; ctx.textAlign = 'center';
        ctx.font = '900 13px "Arial Black", sans-serif'; ctx.fillText('LOW', stackX + stackW - 26, topY + 21);
        ctx.font = 'bold 9px sans-serif'; ctx.fillText('(警告)', stackX + stackW - 26, topY + 33); ctx.restore();
    }

    // 下层托盘：数显分数板
    const scoreY = topY + lifeH + gap, isFlash = p.scoreFlashTimer > 0, fRatio = Math.max(0, p.scoreFlashTimer / 0.40);
    traceChamferRect(ctx, stackX, scoreY, stackW, scoreH, 8);
    ctx.fillStyle = '#334155'; ctx.fill(); ctx.lineWidth = 2.2; ctx.strokeStyle = isFlash ? bright : '#090d16'; ctx.stroke();

    const scX = stackX + 7, scY = scoreY + 6, scW = stackW - 14, scH = scoreH - 12;
    ctx.beginPath(); ctx.roundRect(scX, scY, scW, scH, 5);
    ctx.fillStyle = '#070a12'; ctx.fill(); ctx.lineWidth = 1.5; ctx.strokeStyle = isFlash ? bright : theme; ctx.stroke();

    ctx.fillStyle = theme; ctx.beginPath(); ctx.arc(scX + scW - 11, scY + scH / 2, 2.4, 0, Math.PI * 2); ctx.fill();

    ctx.save(); ctx.shadowColor = theme; ctx.shadowBlur = isFlash ? 14 : 6;
    ctx.fillStyle = isFlash ? bright : theme; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (isP1 && isFlash && fRatio > 0.35) {
        ctx.font = '900 22px "Arial Black", sans-serif'; ctx.fillText('SCORE UP!', scX + scW / 2 - 4, scY + scH / 2 + 1);
    } else {
        ctx.font = '900 30px "Courier New", monospace'; ctx.fillText(`${p.score}`, scX + scW / 2 - 4, scY + scH / 2 + 1);
    }
    ctx.restore();

    if (isFlash) {
        ctx.save(); ctx.globalAlpha = fRatio;
        if (isP1) {
            const exp = (1 - fRatio) * 8;
            ctx.strokeStyle = '#fef08a'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.roundRect(stackX - 4 - exp, scoreY - 4 - exp, stackW + 8 + exp * 2, scoreH + 8 + exp * 2, 11); ctx.stroke();
        } else {
            ctx.save(); ctx.translate(stackX + stackW - 18, scoreY + scoreH - 2); ctx.rotate(-0.14);
            ctx.fillStyle = '#d946ef'; ctx.strokeStyle = '#090d16'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.roundRect(-30, -9, 60, 18, 4); ctx.fill(); ctx.stroke();
            ctx.fillStyle = '#fff'; ctx.font = '900 italic 11px "Arial Black", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText('SCORE!', 0, 0); ctx.restore();
        }
        ctx.restore();
    }
    ctx.restore();
}

function drawIndustrialLaunchers(ctx) {
    launchers.forEach((l, idx) => {
        const isL = idx === 0, theme = isL ? '#facc15' : '#d946ef', shift = l.recoil * 14;
        const aim = isL ? -Math.PI * 0.32 : -Math.PI * 0.68;
        ctx.save();
        ctx.save(); ctx.translate(isL ? 44 : width - 44, height - 42); ctx.rotate(aim); ctx.translate(-shift, 0);
        ctx.fillStyle = '#334155'; ctx.strokeStyle = '#090d16'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.roundRect(0, -20, 52, 40, 5); ctx.fill(); ctx.stroke();
        ctx.fillStyle = theme; ctx.fillRect(10, -4, 26, 8); ctx.restore();

        ctx.beginPath();
        if (isL) { ctx.moveTo(0, height - 88); ctx.lineTo(58, height - 88); ctx.lineTo(88, height - 58); ctx.lineTo(88, height); ctx.lineTo(0, height); }
        else { ctx.moveTo(width, height - 88); ctx.lineTo(width - 58, height - 88); ctx.lineTo(width - 88, height - 58); ctx.lineTo(width - 88, height); ctx.lineTo(width, height); }
        ctx.closePath(); ctx.fillStyle = '#334155'; ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = '#090d16'; ctx.stroke();
        drawHazardStripeBar(ctx, isL ? 10 : width - 74, height - 24, 64, 12, theme);
        ctx.restore();
    });
}

function drawCollectionRack(ctx, pIdx) {
    const p = players[pIdx], geo = getPlayerRackGeometry(pIdx), { rackX, rackY, rackW, rackH } = geo;
    ctx.save();
    ctx.shadowColor = p.color; ctx.shadowBlur = 12;
    ctx.fillStyle = 'rgba(15,23,42,0.82)'; ctx.strokeStyle = p.color; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.roundRect(rackX, rackY, rackW, rackH, 10); ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0; ctx.fillStyle = p.rackBg;
    ctx.beginPath(); ctx.roundRect(rackX + 3, rackY + 3, rackW - 6, rackH - 6, 8); ctx.fill();

    ctx.fillStyle = p.accentColor; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(`${p.name} 词组收集槽 (${p.collectedWords.length}/${RACK_SLOT_COUNT})`, rackX + rackW / 2, rackY + 19);

    for (let i = 0; i < RACK_SLOT_COUNT; i++) {
        const sr = geo.getSlotRect(i), item = p.collectedWords[i];
        if (!item) {
            ctx.save();
            ctx.strokeStyle = pIdx === 0 ? 'rgba(250,204,21,0.35)' : 'rgba(217,70,239,0.35)';
            ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.roundRect(sr.x, sr.y, sr.w, sr.h, 6); ctx.stroke();
            ctx.setLineDash([]); ctx.fillStyle = ctx.strokeStyle; ctx.font = 'bold 12px monospace';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(`0${i + 1} EMPTY`, sr.x + sr.w / 2, sr.y + sr.h / 2); ctx.restore();
        } else {
            ctx.save(); ctx.translate(sr.x + sr.w / 2, sr.y + sr.h / 2);
            const sc = 1.0 + item.flash * 0.08; ctx.scale(sc, sc);
            drawPhraseBadgeGraphic(ctx, sr.w, sr.h - 2, item.word, pIdx, item.flash); ctx.restore();
        }
    }
    ctx.restore();
}

function drawHUD(ctx) {
    const cx = width / 2, topY = 74;
    ctx.save();
    ctx.fillStyle = '#1e293b'; ctx.strokeStyle = '#eab308'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.roundRect(cx - 68, topY - 24, 136, 58, 12); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fef08a'; ctx.font = '900 34px "PingFang SC", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(`【${activeWordBank.base}】`, cx, topY + 6);
    ctx.restore();

    players.forEach((p, idx) => {
        drawPlayerScoreAndHealthHUD(ctx, idx);
        drawCollectionRack(ctx, idx);
    });
}

function drawCrosshair(ctx, p) {
    ctx.save(); ctx.translate(p.x, p.y);
    const cool = p.cooldown > 0, pulse = cool ? 0 : p.firePulse * 4.5;
    const main = cool ? '#64748b' : p.color, sub = cool ? '#475569' : p.accentColor;
    ctx.globalAlpha = cool ? 0.52 : 1.0;
    if (!cool) { ctx.shadowColor = p.color; ctx.shadowBlur = p.firePulse > 0 ? 14 : 6; }

    if (p.id === 1) {
        const oR = 30 + pulse, iR = 25 + pulse * 0.7;
        ctx.strokeStyle = main; ctx.lineWidth = 2;
        for (let i = 0; i < 4; i++) {
            ctx.beginPath(); ctx.arc(0, 0, oR, i * Math.PI / 2 + 0.16, (i + 1) * Math.PI / 2 - 0.16); ctx.stroke();
        }
        ctx.strokeStyle = sub; ctx.lineWidth = 0.9;
        ctx.beginPath(); ctx.moveTo(-iR + 5, 0); ctx.lineTo(iR - 5, 0); ctx.moveTo(0, -iR + 5); ctx.lineTo(0, iR - 5); ctx.stroke();
    } else {
        const oD = 33 + pulse;
        ctx.strokeStyle = main; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(0, -oD); ctx.lineTo(oD, 0); ctx.lineTo(0, oD); ctx.lineTo(-oD, 0); ctx.closePath(); ctx.stroke();
        ctx.strokeStyle = sub; ctx.lineWidth = 0.9;
        ctx.beginPath(); ctx.moveTo(-18, 0); ctx.lineTo(18, 0); ctx.moveTo(0, -18); ctx.lineTo(0, 18); ctx.stroke();
    }

    if (!cool && p.isLocked) {
        ctx.save(); ctx.translate(26, 26); ctx.rotate(-0.12);
        ctx.font = '900 italic 12px "Arial Black", sans-serif'; ctx.strokeStyle = '#090d16'; ctx.lineWidth = 4;
        ctx.strokeText('LOCK!', 0, 0); ctx.fillStyle = p.accentColor; ctx.fillText('LOCK!', 0, 0); ctx.restore();
    }

    if (cool) {
        ctx.save(); ctx.globalAlpha = 0.92;
        const ratio = Math.max(0, p.cooldown / p.maxCooldown);
        ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(0, 0, 39, -Math.PI / 2 + Math.PI * 2 * (1 - ratio), Math.PI * 1.5); ctx.stroke();
        ctx.fillStyle = '#94a3b8'; ctx.font = 'bold 11px monospace'; ctx.textAlign = 'center';
        ctx.fillText(`JAMMED ${p.cooldown.toFixed(1)}s`, 0, 52); ctx.restore();
    }
    ctx.restore();
}

// 7. 初始化与主循环
let lastTime = 0, spawnTimer = 0;
function resizeCanvas() { width = window.innerWidth; height = window.innerHeight; canvas.width = width; canvas.height = height; }
function isTyping() { const el = document.activeElement; return el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA'); }

function init() {
    canvas = document.getElementById('gameCanvas'); ctx = canvas.getContext('2d');
    resizeCanvas(); window.addEventListener('resize', resizeCanvas);
    loadPresetToForm(0); syncReticleSensitivityToFilters();

    players[0].x = players[0].rawX = width * 0.35; players[0].y = players[0].rawY = height * 0.5;
    players[1].x = players[1].rawX = width * 0.65; players[1].y = players[1].rawY = height * 0.5;
    spawnFrisbeeFromLauncher();

    const panel = document.getElementById('settings-panel'), tBtn = document.getElementById('btn-toggle-settings');
    tBtn.onclick = () => { const c = panel.classList.toggle('collapsed'); tBtn.innerText = c ? '⚙️ 设置' : '✖️ 收起设置'; };
    document.getElementById('slider-volume').oninput = e => { sfx.volume = parseFloat(e.target.value); document.getElementById('val-volume').innerText = `${Math.round(sfx.volume * 100)}%`; };
    document.getElementById('chk-mute').onchange = e => sfx.muted = e.target.checked;
    document.getElementById('btn-reset-hp').onclick = () => { players.forEach(p => p.hp = p.maxHp); sfx.playScoreFlash(); };
    document.getElementById('slider-speed').oninput = e => { CONFIG.speedScale = parseFloat(e.target.value); document.getElementById('val-speed').innerText = `${CONFIG.speedScale.toFixed(2)}x`; };
    document.getElementById('slider-damping').oninput = e => { CONFIG.apexDamping = parseFloat(e.target.value); document.getElementById('val-damping').innerText = `${Math.round(CONFIG.apexDamping * 100)}%`; };
    document.getElementById('slider-interval').oninput = e => { CONFIG.spawnInterval = parseFloat(e.target.value); document.getElementById('val-interval').innerText = `${CONFIG.spawnInterval.toFixed(1)}s`; };
    document.getElementById('slider-reticle-sens').oninput = e => { CONFIG.reticleSensitivity = parseFloat(e.target.value); document.getElementById('val-reticle-sens').innerText = `${CONFIG.reticleSensitivity.toFixed(1)}x`; syncReticleSensitivityToFilters(); };
    document.getElementById('slider-gyro-exp').oninput = e => { CONFIG.gyroAccelExponent = parseFloat(e.target.value); document.getElementById('val-gyro-exp').innerText = CONFIG.gyroAccelExponent.toFixed(2); };
    document.getElementById('chk-invert-x').onchange = e => CONFIG.invertGyroX = e.target.checked;
    document.getElementById('chk-invert-y').onchange = e => CONFIG.invertGyroY = e.target.checked;

    const doRecenter = () => { recenterPlayerReticle(0, true); if (players[1].hasJoyCon) recenterPlayerReticle(1, false); };
    document.getElementById('btn-recenter').onclick = doRecenter;
    document.getElementById('btn-panel-recenter').onclick = doRecenter;
    document.querySelectorAll('.preset-btn').forEach(b => b.onclick = () => loadPresetToForm(parseInt(b.dataset.preset, 10)));
    document.getElementById('btn-apply-wordbank').onclick = () => parseAndApplyWordBank(document.getElementById('input-base').value, document.getElementById('input-valid').value, document.getElementById('input-invalid').value);
    document.getElementById('btn-joycon').onclick = () => joyconManager.requestConnection();
    document.getElementById('btn-word').onclick = () => loadPresetToForm((currentPresetIdx + 1) % PRESET_LEVELS.length);

    window.addEventListener('mousemove', e => { if (!players[0].hasJoyCon) { players[0].x = players[0].rawX = e.clientX; players[0].y = players[0].rawY = e.clientY; } });
    window.addEventListener('mousedown', e => { if (!e.target.closest('#settings-wrapper') && !e.target.closest('#ui-bar') && e.button === 0) triggerFire(0); });
    window.addEventListener('keydown', e => {
        if (isTyping()) return;
        const k = e.key.toLowerCase(); if (k in keys) keys[k] = true;
        if (e.code === 'Space' && !e.repeat) { e.preventDefault(); triggerFire(1); }
    });
    window.addEventListener('keyup', e => { const k = e.key.toLowerCase(); if (k in keys) keys[k] = false; });

    requestAnimationFrame(gameLoop);
}

function update(dt) {
    spawnTimer += dt;
    if (spawnTimer >= CONFIG.spawnInterval) {
        spawnTimer = 0; spawnFrisbeeFromLauncher();
        if (Math.random() < 0.25) spawnFrisbeeFromLauncher();
    }
    launchers.forEach(l => { if (l.recoil > 0) l.recoil = Math.max(0, l.recoil - dt * 5.5); });

    const p2 = players[1];
    if (!p2.hasJoyCon) {
        if (keys.w) p2.y -= P2_SPEED * dt; if (keys.s) p2.y += P2_SPEED * dt;
        if (keys.a) p2.x -= P2_SPEED * dt; if (keys.d) p2.x += P2_SPEED * dt;
        p2.x = p2.rawX = Math.max(0, Math.min(width, p2.x)); p2.y = p2.rawY = Math.max(0, Math.min(height, p2.y));
    }

    players.forEach(p => {
        if (p.cooldown > 0) p.cooldown = Math.max(0, p.cooldown - dt);
        if (p.firePulse > 0) p.firePulse = Math.max(0, p.firePulse - dt * 10);
        if (p.scoreFlashTimer > 0) p.scoreFlashTimer = Math.max(0, p.scoreFlashTimer - dt);
        p.collectedWords.forEach(it => { if (it.flash > 0) it.flash = Math.max(0, it.flash - dt * 3.2); });
        p.isLocked = frisbees.some(f => f.isValid && f.hitStopFrames === 0 && Math.hypot(p.x - f.x, p.y - f.y) <= f.radius + 4);
    });

    for (let i = frisbees.length - 1; i >= 0; i--) { frisbees[i].update(dt); if (frisbees[i].markedForDeletion) frisbees.splice(i, 1); }
    for (let i = launcherRings.length - 1; i >= 0; i--) { launcherRings[i].update(dt); if (launcherRings[i].life >= launcherRings[i].duration) launcherRings.splice(i, 1); }
    for (let i = discSectorShards.length - 1; i >= 0; i--) { discSectorShards[i].update(dt); if (discSectorShards[i].alpha <= 0) discSectorShards.splice(i, 1); }
    for (let i = shockwaveRings.length - 1; i >= 0; i--) { shockwaveRings[i].update(dt); if (shockwaveRings[i].life >= shockwaveRings[i].duration) shockwaveRings.splice(i, 1); }
    for (let i = flyingTokens.length - 1; i >= 0; i--) { flyingTokens[i].update(dt); if (flyingTokens[i].finished) flyingTokens.splice(i, 1); }
    for (let i = particles.length - 1; i >= 0; i--) { particles[i].update(dt); if (particles[i].alpha <= 0) particles.splice(i, 1); }
    for (let i = floatingTexts.length - 1; i >= 0; i--) { floatingTexts[i].update(dt); if (floatingTexts[i].alpha <= 0) floatingTexts.splice(i, 1); }
}

function draw() {
    ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, width, height);
    drawHUD(ctx);
    shockwaveRings.forEach(r => r.draw(ctx));
    launcherRings.forEach(r => r.draw(ctx));
    frisbees.forEach(f => f.draw(ctx));
    drawIndustrialLaunchers(ctx);
    discSectorShards.forEach(s => s.draw(ctx));
    particles.forEach(p => p.draw(ctx));
    flyingTokens.forEach(t => t.draw(ctx));
    floatingTexts.forEach(t => t.draw(ctx));
    players.forEach(p => drawCrosshair(ctx, p));
}

function gameLoop(ts) {
    if (!lastTime) lastTime = ts;
    const dt = Math.min((ts - lastTime) / 1000, 0.1);
    lastTime = ts; update(dt); draw();
    requestAnimationFrame(gameLoop);
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
