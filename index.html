<script>
/**
 * ==========================================
 * 1. 标准 1-Euro Filter (自适应低通滤波器)
 * ==========================================
 */
class LowPassFilter {
    constructor() {
        this.y = null;
        this.s = null;
    }

    filter(value, alpha) {
        if (this.y === null) {
            this.s = value;
        } else {
            this.s = alpha * value + (1.0 - alpha) * this.s;
        }
        this.y = value;
        return this.s;
    }

    hasLastRawValue() {
        return this.y !== null;
    }

    lastRawValue() {
        return this.y;
    }

    reset(initialValue = null) {
        this.y = initialValue;
        this.s = initialValue;
    }
}

class OneEuroFilter {
    constructor(minCutoff = 1.0, beta = 0.007, dCutoff = 1.0) {
        this.minCutoff = minCutoff;
        this.beta = beta;
        this.dCutoff = dCutoff;
        this.xFilter = new LowPassFilter();
        this.dxFilter = new LowPassFilter();
        this.lastTime = null;
    }

    alpha(cutoff, dt) {
        const tau = 1.0 / (2.0 * Math.PI * cutoff);
        return 1.0 / (1.0 + tau / dt);
    }

    filter(value, timestamp = performance.now() / 1000) {
        let dt = 1.0 / 60.0;
        if (this.lastTime !== null) {
            const elapsed = timestamp - this.lastTime;
            if (elapsed > 0.001 && elapsed < 0.2) {
                dt = elapsed;
            }
        }
        this.lastTime = timestamp;

        const dValue = this.xFilter.hasLastRawValue()
            ? (value - this.xFilter.lastRawValue()) / dt
            : 0.0;
        const edValue = this.dxFilter.filter(dValue, this.alpha(this.dCutoff, dt));

        const cutoff = this.minCutoff + this.beta * Math.abs(edValue);
        return this.xFilter.filter(value, this.alpha(cutoff, dt));
    }

    reset(anchorValue = null) {
        this.xFilter.reset(anchorValue);
        this.dxFilter.reset(0.0);
        this.lastTime = null;
    }
}

/**
 * ==========================================
 * 2. 全局物理、体感配置与题库数据
 * ==========================================
 */
const CONFIG = {
    speedScale: 0.80,            // 飞盘速度滑块倍率 (范围 0.1x ~ 1.5x, 步长 0.05, 默认 0.80x)
    apexDamping: 0.75,           // 顶点滞空阻尼 (默认 75% 减速)
    spawnInterval: 2.2,          // 飞盘发射间隔 (1.0s ~ 4.0s)

    reticleSensitivity: 0.6,     // 面板「准星灵敏度」滑块倍率 (范围 0.2x ~ 2.0x, 默认 0.6x)
    baseGyroSensitivity: 0.0018, // 底层灵敏度基准
    gyroAccelExponent: 1.20,     // 非线性加速度指数
    gyroStaticDeadzone: 12,      // 静态死区
    oneEuroMinCutoff: 1.0,       // 1-Euro minCutoff (1.0 Hz)
    oneEuroBeta: 0.007,          // 1-Euro beta (0.007)
    oneEuroDCutoff: 1.0,         // 1-Euro dCutoff (1.0 Hz)
    invertGyroX: false,          // 额外手动反转水平偏航 Yaw
    invertGyroY: false           // 额外手动反转垂直俯仰 Pitch
};

const PRESET_LEVELS = [
    {
        base: '电',
        validRaw: '脑:电脑, 话:电话, 影:电影, 视:电视, 池:电池, 梯:电梯, 源:电源, 流:电流, 子:电子, 车:电车',
        invalidRaw: '鱼, 木, 水, 草, 石, 狗, 羊, 鸟, 土, 米'
    },
    {
        base: '水',
        validRaw: '果:水果, 平:水平, 晶:水晶, 滴:水滴, 杯:水杯, 库:水库, 泥:水泥, 手:水手, 稻:水稻, 源:水源',
        invalidRaw: '火, 山, 刀, 车, 日, 月, 木, 石, 布, 金'
    },
    {
        base: '机',
        validRaw: '飞:飞机, 手:手机, 器:机器, 会:机会, 司:司机, 关:机关, 密:机密, 场:机场, 智:机智, 危:危机',
        invalidRaw: '草, 羊, 牛, 鱼, 瓜, 豆, 云, 雨, 雪, 泥'
    }
];

let currentPresetIdx = 0;

let activeWordBank = {
    base: '电',
    validList: [],
    invalidList: []
};

let canvas, ctx;
let width, height;

// 实体与第三阶段特效池
const frisbees = [];
const discSectorShards = []; // 4块扇形几何飞盘碎片池
const shockwaveRings = [];   // 极细半透明冲击波圆环池
const flyingTokens = [];     // 飞行中的合成词战利品胶囊池
const particles = [];        // 细微金属/边角碎屑粒子池
const floatingTexts = [];    // 状态提示漂浮字池

// 战利品垂直收集框固定容量 (4 个卡槽)
const RACK_SLOT_COUNT = 4;

// 玩家状态 (新增 collectedWords 战利品卡槽数组与 slotPulse 落槽高亮动画)
const players = [
    {
        id: 1, name: 'P1',
        x: 0, y: 0,
        rawX: 0, rawY: 0,
        filterX: new OneEuroFilter(CONFIG.oneEuroMinCutoff, CONFIG.oneEuroBeta, CONFIG.oneEuroDCutoff),
        filterY: new OneEuroFilter(CONFIG.oneEuroMinCutoff, CONFIG.oneEuroBeta, CONFIG.oneEuroDCutoff),
        color: '#facc15',        // 电光柠檬黄
        accentColor: '#fef08a',  // 亮白黄高光
        rackBg: 'rgba(250, 204, 21, 0.10)',
        score: 0,
        cooldown: 0,
        maxCooldown: 2.0,
        firePulse: 0,            // 0.1 秒开火微脉冲
        isLocked: false,
        hasJoyCon: false,
        collectedWords: []       // 格式: [{ word: '电脑', flash: 1.0 }, ...] (最多展示最新 4 个)
    },
    {
        id: 2, name: 'P2',
        x: 0, y: 0,
        rawX: 0, rawY: 0,
        filterX: new OneEuroFilter(CONFIG.oneEuroMinCutoff, CONFIG.oneEuroBeta, CONFIG.oneEuroDCutoff),
        filterY: new OneEuroFilter(CONFIG.oneEuroMinCutoff, CONFIG.oneEuroBeta, CONFIG.oneEuroDCutoff),
        color: '#d946ef',        // 高对比荧光紫
        accentColor: '#f5d0fe',  // 亮紫粉高光
        rackBg: 'rgba(217, 70, 239, 0.10)',
        score: 0,
        cooldown: 0,
        maxCooldown: 2.0,
        firePulse: 0,
        isLocked: false,
        hasJoyCon: false,
        collectedWords: []
    }
];

const keys = { w: false, a: false, s: false, d: false };
const P2_SPEED = 650;

/**
 * 计算对应玩家侧边栏垂直收集框 (Collection Rack) 及指定卡槽的几何坐标
 */
function getPlayerRackGeometry(playerIndex) {
    const rackW = 148;
    const rackH = 224;
    const rackX = playerIndex === 0 ? 20 : width - 20 - rackW;
    const rackY = 134;
    const slotW = rackW - 20;
    const slotH = 42;
    const slotStartX = rackX + 10;
    const slotStartY = rackY + 34;
    const slotGap = 46;

    return {
        rackX, rackY, rackW, rackH,
        slotW, slotH,
        getSlotCenter(slotIdx) {
            const clampedIdx = Math.max(0, Math.min(RACK_SLOT_COUNT - 1, slotIdx));
            return {
                x: slotStartX + slotW / 2,
                y: slotStartY + clampedIdx * slotGap + slotH / 2
            };
        },
        getSlotRect(slotIdx) {
            return {
                x: slotStartX,
                y: slotStartY + slotIdx * slotGap,
                w: slotW,
                h: slotH
            };
        }
    };
}

function recenterPlayerReticle(playerIndex, showToast = true) {
    const p = players[playerIndex];
    if (!p) return;

    const cx = width / 2;
    const cy = height / 2;

    p.rawX = cx;
    p.rawY = cy;
    p.x = cx;
    p.y = cy;

    p.filterX.reset(cx);
    p.filterY.reset(cy);

    if (showToast && width && height) {
        floatingTexts.push(
            new FloatingText(cx, cy - 28, `🎯 ${p.name} 准星已归中 & 滤波器已重置`, p.color)
        );
    }
}

function syncReticleSensitivityToFilters() {
    const sensMultiplier = CONFIG.reticleSensitivity;
    players.forEach(p => {
        const dynamicMinCutoff = CONFIG.oneEuroMinCutoff * (0.7 + 0.5 * sensMultiplier);
        const dynamicBeta = CONFIG.oneEuroBeta * (0.75 + 0.4 * sensMultiplier);
        p.filterX.minCutoff = dynamicMinCutoff;
        p.filterY.minCutoff = dynamicMinCutoff;
        p.filterX.beta = dynamicBeta;
        p.filterY.beta = dynamicBeta;
    });
}

/**
 * ==========================================
 * 3. 题库解析与 UI 同步逻辑
 * ==========================================
 */
function parseAndApplyWordBank(baseStr, validStr, invalidStr) {
    const cleanBase = (baseStr || '').trim() || '字';

    const validEntries = validStr
        .split(/[,，\n]+/)
        .map(s => s.trim())
        .filter(Boolean);

    const parsedValid = [];
    for (const item of validEntries) {
        const parts = item.split(/[:：]/).map(s => s.trim()).filter(Boolean);
        if (parts.length >= 2) {
            parsedValid.push({ char: parts[0][0], word: parts[1] });
        } else if (parts.length === 1) {
            const ch = parts[0][0];
            parsedValid.push({ char: ch, word: cleanBase + ch });
        }
    }

    if (parsedValid.length === 0) {
        parsedValid.push({ char: '光', word: cleanBase + '光' });
    }

    const parsedInvalid = invalidStr
        .split(/[,，\s\n]+/)
        .map(s => s.trim())
        .filter(Boolean)
        .map(s => s[0]);

    if (parsedInvalid.length === 0) {
        parsedInvalid.push('✕');
    }

    activeWordBank = {
        base: cleanBase,
        validList: parsedValid,
        invalidList: parsedInvalid
    };

    // 切换关卡时清空场上飞盘与特效，并重置战利品收集槽
    frisbees.length = 0;
    discSectorShards.length = 0;
    shockwaveRings.length = 0;
    flyingTokens.length = 0;
    players.forEach(p => { p.collectedWords = []; });

    if (width && height) {
        floatingTexts.push(
            new FloatingText(width / 2, 135, `✨ 已切换母字【${cleanBase}】`, '#38bdf8')
        );
    }
}

function loadPresetToForm(index) {
    currentPresetIdx = index;
    const preset = PRESET_LEVELS[index];

    document.getElementById('input-base').value = preset.base;
    document.getElementById('input-valid').value = preset.validRaw;
    document.getElementById('input-invalid').value = preset.invalidRaw;

    document.querySelectorAll('.preset-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', idx === index);
    });

    parseAndApplyWordBank(preset.base, preset.validRaw, preset.invalidRaw);
}

/**
 * ==========================================
 * 4. Joy-Con WebHID 激光笔体感驱动引擎
 * ==========================================
 */
class JoyConHIDManager {
    constructor() {
        this.controllers = [null, null];
        this.VENDOR_ID = 0x057e;
        this.PRODUCT_ID_L = 0x2006;
        this.PRODUCT_ID_R = 0x2007;
        this.PRODUCT_ID_PRO = 0x2009;

        if ('hid' in navigator) {
            navigator.hid.addEventListener('disconnect', (e) => {
                this.handleDisconnect(e.device);
            });
        }
    }

    sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    async sendSubcommand(ctrl, subcommand, args = []) {
        const packetNumber = ctrl.packetCounter & 0x0f;
        ctrl.packetCounter = (ctrl.packetCounter + 1) & 0x0f;

        const rumbleData = [0x00, 0x01, 0x40, 0x40, 0x00, 0x01, 0x40, 0x40];
        const payload = new Uint8Array(48);
        payload[0] = packetNumber;
        payload.set(rumbleData, 1);
        payload[9] = subcommand;
        for (let i = 0; i < args.length; i++) {
            payload[10 + i] = args[i];
        }

        await ctrl.device.sendReport(0x01, payload);
    }

    async initializeJoyConHardware(ctrl, playerIndex) {
        await this.sendSubcommand(ctrl, 0x40, [0x01]);
        await this.sleep(60);

        await this.sendSubcommand(ctrl, 0x03, [0x30]);
        await this.sleep(60);

        const ledMask = playerIndex === 0 ? 0x01 : 0x03;
        await this.sendSubcommand(ctrl, 0x30, [ledMask]);
    }

    async requestConnection() {
        if (!('hid' in navigator)) {
            alert('当前浏览器不支持 WebHID API，请使用桌面版 Chrome 或 Edge 浏览器。');
            return;
        }

        try {
            const selectedDevices = await navigator.hid.requestDevice({
                filters: [
                    { vendorId: this.VENDOR_ID, productId: this.PRODUCT_ID_L },
                    { vendorId: this.VENDOR_ID, productId: this.PRODUCT_ID_R },
                    { vendorId: this.VENDOR_ID, productId: this.PRODUCT_ID_PRO }
                ]
            });

            for (const device of selectedDevices) {
                await this.attachDevice(device);
            }
        } catch (err) {
            console.error('[WebHID] 连接设备异常:', err);
        }
    }

    async attachDevice(device) {
        if (this.controllers.some(c => c && c.device === device)) {
            return;
        }

        let targetSlot = -1;
        if (!this.controllers[0]) {
            targetSlot = 0;
        } else if (!this.controllers[1]) {
            targetSlot = 1;
        } else {
            alert('已达到最大 2 只手柄连接上限！');
            return;
        }

        if (!device.opened) {
            await device.open();
        }

        const ctrl = {
            device,
            isLeft: device.productId === this.PRODUCT_ID_L,
            packetCounter: 0,
            lastFirePressed: false,
            lastRecenterPressed: false,
            biasYaw: 0,
            biasPitch: 0,
            stillFrameCount: 0,
            stillAccumYaw: 0,
            stillAccumPitch: 0,
            listener: null
        };

        this.controllers[targetSlot] = ctrl;
        players[targetSlot].hasJoyCon = true;

        recenterPlayerReticle(targetSlot, false);

        ctrl.listener = (event) => this.handleInputReport(targetSlot, ctrl, event);
        device.addEventListener('inputreport', ctrl.listener);

        await this.initializeJoyConHardware(ctrl, targetSlot);

        this.updateUIButton();
        const sideName = ctrl.isLeft ? 'Joy-Con (L)' : 'Joy-Con (R)';
        floatingTexts.push(
            new FloatingText(width / 2, height / 2 - 40, `🎮 ${sideName} 1-Euro 激光笔引擎已接管 P${targetSlot + 1}`, players[targetSlot].color)
        );
    }

    handleDisconnect(device) {
        const idx = this.controllers.findIndex(c => c && c.device === device);
        if (idx === -1) return;

        this.controllers[idx] = null;
        players[idx].hasJoyCon = false;

        if (idx === 0 && this.controllers[1]) {
            const remainingCtrl = this.controllers[1];
            this.controllers[0] = remainingCtrl;
            this.controllers[1] = null;
            players[0].hasJoyCon = true;
            players[1].hasJoyCon = false;

            remainingCtrl.device.removeEventListener('inputreport', remainingCtrl.listener);
            remainingCtrl.listener = (event) => this.handleInputReport(0, remainingCtrl, event);
            remainingCtrl.device.addEventListener('inputreport', remainingCtrl.listener);
            this.sendSubcommand(remainingCtrl, 0x30, [0x01]).catch(() => {});
        }

        this.updateUIButton();
    }

    updateUIButton() {
        const count = this.controllers.filter(Boolean).length;
        const btn = document.getElementById('btn-joycon');
        if (count === 0) {
            btn.innerText = '🎮 连接 Joy-Con (WebHID)';
        } else if (count === 1) {
            btn.innerText = '🎮 已连接 (1/2) [P1体感] - 点击连P2';
        } else {
            btn.innerText = '🎮 双手柄已就绪 (2/2)';
        }
    }

    handleInputReport(playerIndex, ctrl, event) {
        const { data, reportId } = event;
        if (reportId !== 0x30 || data.byteLength < 25) return;

        const player = players[playerIndex];
        if (!player) return;

        const rightBtns = data.getUint8(2);
        const sharedBtns = data.getUint8(3);
        const leftBtns = data.getUint8(4);

        const firePressed =
            (rightBtns & 0x80) !== 0 ||
            (rightBtns & 0x40) !== 0 ||
            (leftBtns & 0x80) !== 0 ||
            (leftBtns & 0x40) !== 0;

        if (firePressed && !ctrl.lastFirePressed) {
            triggerFire(playerIndex);
        }
        ctrl.lastFirePressed = firePressed;

        const recenterPressed = (sharedBtns & 0x3f) !== 0;
        if (recenterPressed && !ctrl.lastRecenterPressed) {
            recenterPlayerReticle(playerIndex, true);
            return;
        }
        ctrl.lastRecenterPressed = recenterPressed;

        const frameCount = data.byteLength >= 48 ? 3 : 1;
        let sumPitch = 0;
        let sumYaw = 0;

        for (let i = 0; i < frameCount; i++) {
            const frameOffset = 12 + i * 12;
            const gyroY = data.getInt16(frameOffset + 8, true);  // Pitch
            const gyroZ = data.getInt16(frameOffset + 10, true); // Yaw
            sumPitch += gyroY;
            sumYaw += gyroZ;
        }

        const rawPitch = sumPitch / frameCount;
        const rawYaw = sumYaw / frameCount;

        const staticDeadzone = CONFIG.gyroStaticDeadzone;
        const diffYaw = Math.abs(rawYaw - ctrl.biasYaw);
        const diffPitch = Math.abs(rawPitch - ctrl.biasPitch);

        if (
            (diffYaw < staticDeadzone && diffPitch < staticDeadzone) ||
            (Math.abs(rawYaw) < 65 && Math.abs(rawPitch) < 65 && ctrl.stillFrameCount > 0)
        ) {
            if (Math.abs(rawYaw) < 65 && Math.abs(rawPitch) < 65) {
                ctrl.stillFrameCount++;
                ctrl.stillAccumYaw += rawYaw;
                ctrl.stillAccumPitch += rawPitch;

                if (ctrl.stillFrameCount >= 30) {
                    const avgYaw = ctrl.stillAccumYaw / ctrl.stillFrameCount;
                    const avgPitch = ctrl.stillAccumPitch / ctrl.stillFrameCount;
                    ctrl.biasYaw = ctrl.biasYaw === 0 ? avgYaw : (ctrl.biasYaw * 0.7 + avgYaw * 0.3);
                    ctrl.biasPitch = ctrl.biasPitch === 0 ? avgPitch : (ctrl.biasPitch * 0.7 + avgPitch * 0.3);
                    ctrl.stillFrameCount = 0;
                    ctrl.stillAccumYaw = 0;
                    ctrl.stillAccumPitch = 0;
                }
            }
        } else {
            ctrl.stillFrameCount = 0;
            ctrl.stillAccumYaw = 0;
            ctrl.stillAccumPitch = 0;
        }

        let calibratedYaw = rawYaw - ctrl.biasYaw;
        let calibratedPitch = rawPitch - ctrl.biasPitch;

        if (Math.abs(calibratedYaw) < staticDeadzone) calibratedYaw = 0;
        if (Math.abs(calibratedPitch) < staticDeadzone) calibratedPitch = 0;

        const pitchHandSign = ctrl.isLeft ? 1 : -1;
        const yawDir = (CONFIG.invertGyroX ? -1 : 1) * 1;
        const pitchDir = (CONFIG.invertGyroY ? -1 : 1) * pitchHandSign;

        const vYaw = calibratedYaw * yawDir;
        const vPitch = calibratedPitch * pitchDir;

        const exp = CONFIG.gyroAccelExponent;
        const effectiveSensitivity = CONFIG.baseGyroSensitivity * CONFIG.reticleSensitivity;

        const dx = Math.sign(vYaw) * Math.pow(Math.abs(vYaw), exp) * effectiveSensitivity;
        const dy = Math.sign(vPitch) * Math.pow(Math.abs(vPitch), exp) * effectiveSensitivity;

        player.rawX = Math.max(0, Math.min(width, player.rawX + dx));
        player.rawY = Math.max(0, Math.min(height, player.rawY + dy));

        const nowSec = performance.now() / 1000;
        player.x = Math.max(0, Math.min(width, player.filterX.filter(player.rawX, nowSec)));
        player.y = Math.max(0, Math.min(height, player.filterY.filter(player.rawY, nowSec)));
    }
}

const joyconManager = new JoyConHIDManager();

/**
 * ==========================================
 * 5. 高清矢量工业街头飞盘绘制函数 (支持完整盘、3帧Hit-Stop裂纹态、以及4扇形碎片裁剪)
 * ==========================================
 */
function renderDiscFaceGraphic(ctx, R, isValid, themeVariant, angle, char) {
    // 1. 绘制随飞盘自转的双层工业盘体
    ctx.save();
    ctx.rotate(angle);

    if (isValid) {
        const isYellowTeal = themeVariant === 0;

        const rimGrad = ctx.createRadialGradient(-R * 0.25, -R * 0.25, R * 0.45, 0, 0, R);
        if (isYellowTeal) {
            rimGrad.addColorStop(0, '#fef08a');
            rimGrad.addColorStop(0.55, '#eab308');
            rimGrad.addColorStop(0.88, '#ca8a04');
            rimGrad.addColorStop(1, '#713f12');
        } else {
            rimGrad.addColorStop(0, '#fdba74');
            rimGrad.addColorStop(0.55, '#f97316');
            rimGrad.addColorStop(0.88, '#c2410c');
            rimGrad.addColorStop(1, '#431407');
        }

        ctx.beginPath();
        ctx.arc(0, 0, R, 0, Math.PI * 2);
        ctx.fillStyle = rimGrad;
        ctx.fill();

        ctx.save();
        ctx.beginPath();
        ctx.arc(0, 0, R - 1.5, 0, Math.PI * 2);
        ctx.clip();

        ctx.fillStyle = isYellowTeal ? 'rgba(20, 184, 166, 0.45)' : 'rgba(15, 23, 42, 0.55)';
        ctx.beginPath();
        ctx.arc(R * 0.65, R * 0.45, R * 0.42, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = isYellowTeal ? 'rgba(15, 23, 42, 0.28)' : 'rgba(6, 182, 212, 0.32)';
        ctx.beginPath();
        ctx.arc(-R * 0.62, R * 0.52, R * 0.32, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.lineWidth = 3;
        ctx.strokeStyle = '#090d16';
        ctx.beginPath();
        ctx.arc(0, 0, R - 1, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(15, 23, 42, 0.65)';
        ctx.lineWidth = 2;
        for (let i = 0; i < 4; i++) {
            const a = (i * Math.PI) / 2 + 0.35;
            ctx.beginPath();
            ctx.moveTo(Math.cos(a) * (R * 0.72), Math.sin(a) * (R * 0.72));
            ctx.lineTo(Math.cos(a) * (R * 0.96), Math.sin(a) * (R * 0.96));
            ctx.stroke();
        }

        const innerR = R * 0.72;
        ctx.beginPath();
        ctx.arc(0, 0, innerR + 3, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.55)';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(0, 0, innerR + 1, 0, Math.PI * 2);
        ctx.strokeStyle = isYellowTeal ? '#fef9c3' : '#ffedd5';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        const coreGrad = ctx.createRadialGradient(-innerR * 0.2, -innerR * 0.2, innerR * 0.1, 0, 0, innerR);
        if (isYellowTeal) {
            coreGrad.addColorStop(0, '#5eead4');
            coreGrad.addColorStop(0.6, '#14b8a6');
            coreGrad.addColorStop(1, '#0f766e');
        } else {
            coreGrad.addColorStop(0, '#ea580c');
            coreGrad.addColorStop(0.65, '#9a3412');
            coreGrad.addColorStop(1, '#1e293b');
        }

        ctx.save();
        ctx.beginPath();
        ctx.arc(0, 0, innerR, 0, Math.PI * 2);
        ctx.fillStyle = coreGrad;
        ctx.fill();
        ctx.clip();

        if (isYellowTeal) {
            ctx.save();
            ctx.translate(-innerR * 0.55, -innerR * 0.42);
            ctx.rotate(-0.28);
            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(-14, -9, 28, 18);
            ctx.fillStyle = '#d946ef';
            ctx.fillRect(-11, -6, 22, 12);
            ctx.restore();

            ctx.fillStyle = '#ea580c';
            ctx.beginPath();
            ctx.arc(innerR * 0.52, innerR * 0.48, 11, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.stroke();
        } else {
            ctx.fillStyle = '#090d16';
            ctx.beginPath();
            ctx.moveTo(innerR * 0.15, -innerR);
            ctx.lineTo(innerR, -innerR * 0.2);
            ctx.lineTo(innerR, innerR);
            ctx.lineTo(-innerR * 0.2, innerR);
            ctx.closePath();
            ctx.fill();

            ctx.save();
            ctx.translate(-innerR * 0.58, innerR * 0.35);
            ctx.rotate(0.4);
            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(-13, -8, 26, 16);
            ctx.fillStyle = '#090d16';
            ctx.fillRect(-9, -8, 5, 16);
            ctx.fillRect(1, -8, 5, 16);
            ctx.restore();

            ctx.strokeStyle = '#2dd4bf';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(innerR * 0.25, innerR * 0.65);
            ctx.lineTo(innerR * 0.75, innerR * 0.35);
            ctx.stroke();
        }

        ctx.beginPath();
        ctx.arc(0, 0, innerR - 1, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(9, 13, 22, 0.75)';
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.restore();

    } else {
        const metalGrad = ctx.createRadialGradient(-R * 0.3, -R * 0.3, R * 0.2, 0, 0, R);
        metalGrad.addColorStop(0, '#64748b');
        metalGrad.addColorStop(0.55, '#334155');
        metalGrad.addColorStop(0.88, '#1e293b');
        metalGrad.addColorStop(1, '#090d16');

        ctx.beginPath();
        ctx.arc(0, 0, R, 0, Math.PI * 2);
        ctx.fillStyle = metalGrad;
        ctx.fill();

        ctx.lineWidth = 3;
        ctx.strokeStyle = '#090d16';
        ctx.stroke();

        ctx.strokeStyle = '#0f172a';
        ctx.lineWidth = 2.5;
        for (let i = 0; i < 4; i++) {
            const a = (i * Math.PI) / 2 + Math.PI / 4;
            ctx.beginPath();
            ctx.moveTo(Math.cos(a) * (R * 0.78), Math.sin(a) * (R * 0.78));
            ctx.lineTo(Math.cos(a) * (R * 0.98), Math.sin(a) * (R * 0.98));
            ctx.stroke();
        }

        const hazardOuterR = R * 0.79;
        const hazardInnerR = R * 0.65;
        const stripeMidR = (hazardOuterR + hazardInnerR) / 2;
        const stripeWidth = hazardOuterR - hazardInnerR;

        ctx.beginPath();
        ctx.arc(0, 0, stripeMidR, 0, Math.PI * 2);
        ctx.strokeStyle = '#eab308';
        ctx.lineWidth = stripeWidth;
        ctx.stroke();

        const numStripes = 18;
        const stepAngle = (Math.PI * 2) / numStripes;
        ctx.strokeStyle = '#111827';
        ctx.lineWidth = stripeWidth + 1;
        for (let i = 0; i < numStripes; i++) {
            const startA = i * stepAngle;
            ctx.beginPath();
            ctx.arc(0, 0, stripeMidR, startA, startA + stepAngle * 0.52);
            ctx.stroke();
        }

        ctx.lineWidth = 2;
        ctx.strokeStyle = '#090d16';
        ctx.beginPath();
        ctx.arc(0, 0, hazardOuterR, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(0, 0, hazardInnerR, 0, Math.PI * 2);
        ctx.stroke();

        const coreGrad = ctx.createRadialGradient(-R * 0.15, -R * 0.15, 4, 0, 0, hazardInnerR);
        coreGrad.addColorStop(0, '#475569');
        coreGrad.addColorStop(0.7, '#334155');
        coreGrad.addColorStop(1, '#1e293b');

        ctx.beginPath();
        ctx.arc(0, 0, hazardInnerR - 1, 0, Math.PI * 2);
        ctx.fillStyle = coreGrad;
        ctx.fill();

        const plateR = hazardInnerR * 0.82;
        ctx.beginPath();
        for (let i = 0; i < 8; i++) {
            const a = (i * Math.PI) / 4 + Math.PI / 8;
            const px = Math.cos(a) * plateR;
            const py = Math.sin(a) * plateR;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fillStyle = '#273244';
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#0f172a';
        ctx.stroke();

        const rivetDist = hazardInnerR * 0.62;
        for (let i = 0; i < 4; i++) {
            const a = (i * Math.PI) / 2 + Math.PI / 4;
            const rx = Math.cos(a) * rivetDist;
            const ry = Math.sin(a) * rivetDist;
            ctx.beginPath();
            ctx.arc(rx, ry, 3.2, 0, Math.PI * 2);
            ctx.fillStyle = '#0f172a';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(rx - 0.6, ry - 0.6, 1.2, 0, Math.PI * 2);
            ctx.fillStyle = '#94a3b8';
            ctx.fill();
        }
    }

    ctx.restore();

    // 2. 顶部固定立体高光弧
    ctx.save();
    ctx.beginPath();
    ctx.arc(0, 0, R - 4, -Math.PI * 0.82, -Math.PI * 0.18);
    ctx.strokeStyle = isValid ? 'rgba(255, 255, 255, 0.55)' : 'rgba(226, 232, 240, 0.35)';
    ctx.lineWidth = 3.5;
    ctx.lineCap = 'round';
    ctx.stroke();
    ctx.restore();

    // 3. 盘心汉字
    const fontSize = Math.round(R * 1.2);
    ctx.save();
    ctx.font = `900 ${fontSize}px "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Heiti SC", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.miterLimit = 2;

    if (isValid) {
        if (themeVariant === 0) {
            ctx.save();
            ctx.shadowColor = 'rgba(0, 0, 0, 0.65)';
            ctx.shadowBlur = 6;
            ctx.shadowOffsetY = 4;
            ctx.lineWidth = 11;
            ctx.strokeStyle = '#ffffff';
            ctx.strokeText(char, 0, 3);
            ctx.restore();

            ctx.lineWidth = 5;
            ctx.strokeStyle = '#090d16';
            ctx.strokeText(char, 0, 3);

            ctx.fillStyle = '#18181b';
            ctx.fillText(char, 0, 3);
        } else {
            ctx.save();
            ctx.shadowColor = 'rgba(0, 0, 0, 0.75)';
            ctx.shadowBlur = 6;
            ctx.shadowOffsetY = 4;
            ctx.lineWidth = 9;
            ctx.strokeStyle = '#090d16';
            ctx.strokeText(char, 0, 3);
            ctx.restore();

            ctx.fillStyle = '#fef08a';
            ctx.fillText(char, 0, 3);

            ctx.lineWidth = 2;
            ctx.strokeStyle = '#090d16';
            ctx.strokeText(char, 0, 3);
        }
    } else {
        ctx.save();
        ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
        ctx.shadowBlur = 4;
        ctx.shadowOffsetY = 3;
        ctx.lineWidth = 9;
        ctx.strokeStyle = '#090d16';
        ctx.strokeText(char, 0, 3);
        ctx.restore();

        ctx.lineWidth = 3.5;
        ctx.strokeStyle = '#64748b';
        ctx.strokeText(char, 0, 3);

        ctx.fillStyle = '#1e293b';
        ctx.fillText(char, 0, 3);
    }

    ctx.restore();
}

function drawDisc(ctx, disc) {
    const R = disc.radius;

    // 2.5D 空中俯仰透视纵向缩放比 scaleY (0.82 ~ 1.0)
    const speedRatio = Math.min(1.0, Math.abs(disc.normVy) / 310);
    const scaleY = 1.0 - 0.18 * speedRatio;

    ctx.save();
    ctx.translate(disc.x, disc.y);
    ctx.scale(1.0, scaleY);

    // 0. 绘制 2.5D 立体底盘厚度边与环境投影
    const lipDepth = (1.0 - scaleY) * 28 + 3.5;
    ctx.save();
    ctx.shadowColor = 'rgba(0, 0, 0, 0.58)';
    ctx.shadowBlur = 16;
    ctx.shadowOffsetY = 8;

    ctx.beginPath();
    ctx.arc(0, lipDepth, R, 0, Math.PI * 2);
    if (!disc.isValid) {
        ctx.fillStyle = '#0f141c';
    } else {
        ctx.fillStyle = disc.themeVariant === 0 ? '#3f4d08' : '#571f06';
    }
    ctx.fill();
    ctx.restore();

    // 绘制盘面主体
    renderDiscFaceGraphic(ctx, R, disc.isValid, disc.themeVariant, disc.angle, disc.char);

    // 如果处于 3 帧打击顿帧 (Hit-Stop) 状态，叠加复刻设计图 02 的深黑锯齿裂纹与高光闪白
    if (disc.hitStopFrames > 0) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(0, 0, R, 0, Math.PI * 2);
        ctx.clip();

        // 瞬间受击高亮闪光罩
        ctx.fillStyle = 'rgba(255, 255, 255, 0.28)';
        ctx.fillRect(-R, -R, R * 2, R * 2);

        // 4 条放射状锯齿深黑裂隙 (预示即将分裂为 4 块扇形碎片)
        ctx.strokeStyle = '#090d16';
        ctx.lineWidth = 5.5;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'miter';
        const crackAngles = [-0.72, 0.82, 2.38, -2.28];
        crackAngles.forEach((baseA, idx) => {
            ctx.beginPath();
            ctx.moveTo(0, 0);
            const midR1 = R * 0.36;
            const midR2 = R * 0.70;
            const zig1 = baseA + (idx % 2 === 0 ? 0.16 : -0.16);
            const zig2 = baseA + (idx % 2 === 0 ? -0.12 : 0.12);
            ctx.lineTo(Math.cos(zig1) * midR1, Math.sin(zig1) * midR1);
            ctx.lineTo(Math.cos(zig2) * midR2, Math.sin(zig2) * midR2);
            ctx.lineTo(Math.cos(baseA) * (R + 4), Math.sin(baseA) * (R + 4));
            ctx.stroke();
        });

        // 裂纹中心亮青/亮白能量内芯线
        ctx.strokeStyle = '#fef08a';
        ctx.lineWidth = 1.6;
        crackAngles.forEach((baseA, idx) => {
            ctx.beginPath();
            ctx.moveTo(0, 0);
            const zig1 = baseA + (idx % 2 === 0 ? 0.16 : -0.16);
            ctx.lineTo(Math.cos(zig1) * (R * 0.45), Math.sin(zig1) * (R * 0.45));
            ctx.stroke();
        });

        ctx.restore();
    }

    ctx.restore();
}

/**
 * ==========================================
 * 6. 飞盘与第三阶段命中特效类 (扇形碎片、极细冲击波环、战利品飞入胶囊)
 * ==========================================
 */
class Frisbee {
    constructor() {
        this.radius = 52;
        const fromLeft = Math.random() < 0.5;
        this.x = fromLeft ? -this.radius : width + this.radius;
        this.y = height - 40 - Math.random() * 70;

        const apexX = width * (0.26 + Math.random() * 0.48);
        const apexY = height * (0.18 + Math.random() * 0.24);

        this.baseGravity = 220;
        const dy = this.y - apexY;

        this.baseVy = -Math.sqrt(2 * this.baseGravity * dy);
        const baseTimeToApex = -this.baseVy / this.baseGravity;
        this.baseVx = (apexX - this.x) / baseTimeToApex;

        this.normVx = this.baseVx;
        this.normVy = this.baseVy;

        this.isValid = Math.random() < 0.65;
        this.themeVariant = Math.random() < 0.55 ? 0 : 1;

        if (this.isValid) {
            const item = activeWordBank.validList[
                Math.floor(Math.random() * activeWordBank.validList.length)
            ];
            this.char = item.char;
            this.fullWord = item.word;
        } else {
            const ch = activeWordBank.invalidList[
                Math.floor(Math.random() * activeWordBank.invalidList.length)
            ];
            this.char = ch;
            this.fullWord = activeWordBank.base + ch;
        }

        this.angle = Math.random() * Math.PI * 2;
        this.baseSpinSpeed = (fromLeft ? 1 : -1) * (1.2 + Math.random() * 1.0);
        this.markedForDeletion = false;

        // 第三阶段：3 帧打击顿帧 (Hit-Stop) 状态
        this.hitStopFrames = 0;
        this.hitStopTimer = 0;
        this.hitByPlayerIndex = -1;
    }

    update(dt) {
        // 如果处于被击中后的 3 帧打击顿帧期 (约 0.05s)，硬性定格一切物理位移与旋转！
        if (this.hitStopFrames > 0) {
            this.hitStopTimer -= dt;
            this.hitStopFrames--;
            if (this.hitStopFrames <= 0 || this.hitStopTimer <= 0) {
                // 定格结束瞬间：触发 4 扇形几何碎裂、极细冲击波环与战利品词条飞入
                shatterDiscAfterHitStop(this);
                this.markedForDeletion = true;
            }
            return;
        }

        const speedScale = CONFIG.speedScale;

        const floatThreshold = 165;
        let apexTimeScale = 1.0;

        if (Math.abs(this.normVy) < floatThreshold) {
            const factor = Math.abs(this.normVy) / floatThreshold;
            const minTimeScale = Math.max(0.08, 1.0 - CONFIG.apexDamping);
            apexTimeScale = minTimeScale + (1.0 - minTimeScale) * Math.pow(factor, 2.0);
        }

        const effectiveDt = dt * speedScale * apexTimeScale;

        this.x += this.normVx * effectiveDt;
        this.y += this.normVy * effectiveDt;
        this.normVy += this.baseGravity * effectiveDt;
        this.angle += this.baseSpinSpeed * effectiveDt;

        if (this.y > height + this.radius + 50 && this.normVy > 0) {
            this.markedForDeletion = true;
        }
    }

    draw(ctx) {
        drawDisc(ctx, this);
    }
}

/**
 * 【第三阶段新增 1】4 块扇形几何飞盘碎片 (DiscSectorShard)
 * 复刻设计图 02：飞盘被击中后分裂成 4 块带锯齿断口的扇形几何块，保留原飞盘上的部分汉字与外环向外旋转飞散渐隐
 */
class DiscSectorShard {
    constructor(disc, quadrantIndex) {
        this.x = disc.x;
        this.y = disc.y;
        this.radius = disc.radius;
        this.isValid = disc.isValid;
        this.themeVariant = disc.themeVariant;
        this.discAngle = disc.angle;
        this.char = disc.char;

        // 每个扇形占据约 90 度象限，带不规则锯齿分界角
        const baseStart = quadrantIndex * (Math.PI / 2) - Math.PI * 0.22;
        const baseEnd = baseStart + Math.PI / 2;
        this.startAngle = baseStart;
        this.endAngle = baseEnd;
        const midAngle = (baseStart + baseEnd) / 2;

        // 锯齿内边节点偏移
        this.jag1Angle = baseStart + 0.14;
        this.jag2Angle = baseEnd - 0.14;

        // 沿象限中心向外爆开初速度
        const ejectSpeed = 135 + Math.random() * 85;
        this.vx = Math.cos(midAngle) * ejectSpeed + (Math.random() - 0.5) * 35;
        this.vy = Math.sin(midAngle) * ejectSpeed - 35;
        this.gravity = 380;

        // 碎片自身旋转角与角速度
        this.shardRotation = 0;
        this.rotSpeed = ((quadrantIndex % 2 === 0 ? 1 : -1) * (2.2 + Math.random() * 2.0));

        // 初始就已经微微裂开 5px 间隙，强化瞬间碎裂感
        this.x += Math.cos(midAngle) * 5;
        this.y += Math.sin(midAngle) * 5;

        this.alpha = 1.0;
        this.decay = 1.55; // 约 0.65 秒内平滑渐隐
    }

    update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.vy += this.gravity * dt;
        this.shardRotation += this.rotSpeed * dt;
        this.alpha -= this.decay * dt;
    }

    draw(ctx) {
        if (this.alpha <= 0) return;
        const R = this.radius;

        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.translate(this.x, this.y);
        ctx.rotate(this.shardRotation);

        // 构建带锯齿断口的 90° 扇形裁剪路径
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(this.jag1Angle) * (R * 0.42), Math.sin(this.jag1Angle) * (R * 0.42));
        ctx.lineTo(Math.cos(this.startAngle) * (R + 3), Math.sin(this.startAngle) * (R + 3));
        ctx.arc(0, 0, R + 3, this.startAngle, this.endAngle, false);
        ctx.lineTo(Math.cos(this.jag2Angle) * (R * 0.48), Math.sin(this.jag2Angle) * (R * 0.48));
        ctx.closePath();

        // 裁剪并渲染原飞盘对应的局部扇面 (含局部汉字与外环)
        ctx.save();
        ctx.clip();
        renderDiscFaceGraphic(ctx, R, this.isValid, this.themeVariant, this.discAngle, this.char);
        ctx.restore();

        // 为扇形断口边缘勾勒一层锐利的深黑断裂线
        ctx.strokeStyle = '#090d16';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        ctx.restore();
    }
}

/**
 * 【第三阶段新增 2】极细半透明冲击波圆环 (ShockwaveRing)
 * 复刻设计图 02 右侧：击中点扩散出一圈干净、极细的半透明冲击环与微细径向气流线
 */
class ShockwaveRing {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 22;
        this.maxRadius = 92;
        this.alpha = 0.88;
        this.life = 0;
        this.duration = 0.34; // 0.34 秒快速干脆扩散完毕
    }

    update(dt) {
        this.life += dt;
        const progress = Math.min(1.0, this.life / this.duration);
        // Ease-Out 快速扩张并平滑渐隐
        const easeOut = 1 - Math.pow(1 - progress, 3);
        this.radius = 22 + (this.maxRadius - 22) * easeOut;
        this.alpha = 0.88 * (1 - progress);
    }

    draw(ctx) {
        if (this.alpha <= 0.01) return;
        ctx.save();
        ctx.translate(this.x, this.y);

        // 1. 外圈极细半透明柔光冲击环
        ctx.strokeStyle = `rgba(241, 245, 249, ${this.alpha * 0.85})`;
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.stroke();

        // 2. 内圈紧随的极细副环
        ctx.strokeStyle = `rgba(148, 163, 184, ${this.alpha * 0.45})`;
        ctx.lineWidth = 0.9;
        ctx.beginPath();
        ctx.arc(0, 0, this.radius * 0.86, 0, Math.PI * 2);
        ctx.stroke();

        // 3. 外围 4 组极细切向/径向气流短线 (复刻设计图 02 冲击环周围的细白线)
        const streakAngles = [-2.4, -0.5, 0.8, 2.35];
        ctx.strokeStyle = `rgba(255, 255, 255, ${this.alpha * 0.75})`;
        ctx.lineWidth = 1.1;
        streakAngles.forEach(a => {
            const r1 = this.radius + 3;
            const r2 = this.radius + 11;
            ctx.beginPath();
            ctx.moveTo(Math.cos(a) * r1, Math.sin(a) * r1);
            ctx.lineTo(Math.cos(a) * r2, Math.sin(a) * r2);
            ctx.stroke();
        });

        ctx.restore();
    }
}

/**
 * 【第三阶段新增 3】发光战利品合成词胶囊标签 (FlyingPhraseToken)
 * 复刻设计图 03：击中合法字后生成如 [电脑 +10] 的高饱和街头胶囊卡牌，沿平滑缓动曲线飞入对应玩家的垂直收集框卡槽并点亮
 */
class FlyingPhraseToken {
    constructor(startX, startY, fullWord, playerIndex) {
        this.playerIndex = playerIndex;
        this.player = players[playerIndex];
        this.fullWord = fullWord;
        this.pointsText = '+10';

        this.startX = startX;
        this.startY = startY;
        this.x = startX;
        this.y = startY;

        // 确定该词条即将落入的目标卡槽索引 (0 ~ 3)
        const currentCount = this.player.collectedWords.length;
        this.targetSlotIdx = Math.min(RACK_SLOT_COUNT - 1, currentCount);

        // 贝塞尔弧线控制点偏移（向上拱起形成优美抛物飞入轨迹）
        this.ctrlOffsetY = -95;

        this.elapsed = 0;
        this.holdDuration = 0.16;   // 前 0.16s 在击碎原位弹出展示
        this.flyDuration = 0.56;    // 随后 0.56s 平滑缓动飞入侧边栏卡槽
        this.totalDuration = this.holdDuration + this.flyDuration;
        this.scale = 0.5;
        this.finished = false;
    }

    update(dt) {
        this.elapsed += dt;
        const rackGeo = getPlayerRackGeometry(this.playerIndex);
        const targetPos = rackGeo.getSlotCenter(this.targetSlotIdx);

        if (this.elapsed <= this.holdDuration) {
            // 阶段 A：原位弹性弹出放大 (Back-Out Pop)
            const t = this.elapsed / this.holdDuration;
            this.scale = 0.6 + 0.52 * Math.sin(t * Math.PI * 0.65);
            this.x = this.startX;
            this.y = this.startY - t * 12;
        } else {
            // 阶段 B：Ease-In-Out 三次缓动沿二次贝塞尔曲线飞向目标卡槽
            const rawT = Math.min(1.0, (this.elapsed - this.holdDuration) / this.flyDuration);
            const easeT = rawT < 0.5
                ? 4 * rawT * rawT * rawT
                : 1 - Math.pow(-2 * rawT + 2, 3) / 2;

            const p0x = this.startX;
            const p0y = this.startY - 12;
            const p2x = targetPos.x;
            const p2y = targetPos.y;
            const p1x = (p0x + p2x) * 0.5;
            const p1y = Math.min(p0y, p2y) + this.ctrlOffsetY;

            const invT = 1 - easeT;
            this.x = invT * invT * p0x + 2 * invT * easeT * p1x + easeT * easeT * p2x;
            this.y = invT * invT * p0y + 2 * invT * easeT * p1y + easeT * easeT * p2y;
            this.scale = 1.12 - 0.12 * easeT;

            if (rawT >= 1.0 && !this.finished) {
                this.finished = true;
                // 到达卡槽瞬间：点亮对应玩家收集框卡槽并加分 (+10)
                this.player.score += 10;
                if (this.player.collectedWords.length >= RACK_SLOT_COUNT) {
                    this.player.collectedWords.shift();
                }
                this.player.collectedWords.push({
                    word: this.fullWord,
                    flash: 1.0 // 触发卡槽高亮脉冲
                });
            }
        }
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.scale(this.scale, this.scale);
        drawPhraseBadgeGraphic(ctx, 128, 40, this.fullWord, this.playerIndex, 1.0);
        ctx.restore();
    }
}

/**
 * 绘制统一风格的战利品合成词胶囊卡牌 (复刻设计图 03 的【电脑+10】【电车+10】样式)
 */
function drawPhraseBadgeGraphic(ctx, w, h, wordText, playerIndex, flashIntensity = 0) {
    const isP1 = playerIndex === 0;
    const halfW = w / 2;
    const halfH = h / 2;

    ctx.save();

    // 外发光与立体底部投影
    ctx.shadowColor = isP1 ? 'rgba(250, 204, 21, 0.55)' : 'rgba(217, 70, 239, 0.55)';
    ctx.shadowBlur = 10 + flashIntensity * 14;

    // 1. 胶囊外层亮白/浅紫贴纸边框
    ctx.fillStyle = isP1 ? '#f8fafc' : '#f5d0fe';
    ctx.strokeStyle = '#090d16';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.roundRect(-halfW, -halfH, w, h, 8);
    ctx.fill();
    ctx.stroke();

    // 2. 胶囊内芯高饱和渐变底板 (P1 明柠檬黄 / P2 电光荧光紫)
    ctx.shadowBlur = 0;
    const innerPad = 3.2;
    const grad = ctx.createLinearGradient(0, -halfH + innerPad, 0, halfH - innerPad);
    if (isP1) {
        grad.addColorStop(0, '#fef08a');
        grad.addColorStop(0.5, '#facc15');
        grad.addColorStop(1, '#eab308');
    } else {
        grad.addColorStop(0, '#e879f9');
        grad.addColorStop(0.5, '#d946ef');
        grad.addColorStop(1, '#a21caf');
    }

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.roundRect(-halfW + innerPad, -halfH + innerPad, w - innerPad * 2, h - innerPad * 2, 5.5);
    ctx.fill();

    // 3. 绘制带纯黑粗描边的白字：【电脑 +10】
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.miterLimit = 2;

    // 左侧汉字词组
    ctx.font = '900 20px "PingFang SC", "Microsoft YaHei", "Heiti SC", sans-serif';
    ctx.textAlign = 'left';
    ctx.lineWidth = 5.5;
    ctx.strokeStyle = '#090d16';
    ctx.strokeText(wordText, -halfW + 12, 1.5);
    ctx.fillStyle = '#ffffff';
    ctx.fillText(wordText, -halfW + 12, 1.5);

    // 右侧 +10 分值标识
    ctx.font = '900 17px "Arial Black", "PingFang SC", sans-serif';
    ctx.textAlign = 'right';
    ctx.lineWidth = 5.0;
    ctx.strokeStyle = '#090d16';
    ctx.strokeText('+10', halfW - 10, 2);
    ctx.fillStyle = isP1 ? '#fef9c3' : '#fae8ff';
    ctx.fillText('+10', halfW - 10, 2);

    // 落槽瞬间的高亮白光闪耀层
    if (flashIntensity > 0.05) {
        ctx.fillStyle = `rgba(255, 255, 255, ${flashIntensity * 0.65})`;
        ctx.beginPath();
        ctx.roundRect(-halfW, -halfH, w, h, 8);
        ctx.fill();
    }

    ctx.restore();
}

class ShardParticle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        const angle = Math.random() * Math.PI * 2;
        const speed = 75 + Math.random() * 190;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed - 40;
        this.gravity = 520;
        this.color = color;
        this.alpha = 1;
        this.decay = 1.8 + Math.random() * 0.8;
        this.rotation = Math.random() * Math.PI * 2;
        this.rotSpeed = (Math.random() - 0.5) * 14;
        this.size = 5 + Math.random() * 7;
    }

    update(dt) {
        this.x += this.vx * dt;
        this.y += this.vy * dt;
        this.vy += this.gravity * dt;
        this.rotation += this.rotSpeed * dt;
        this.alpha -= this.decay * dt;
    }

    draw(ctx) {
        if (this.alpha <= 0) return;
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);
        ctx.fillStyle = this.color;
        ctx.strokeStyle = '#090d16';
        ctx.lineWidth = 1.2;

        ctx.beginPath();
        ctx.moveTo(-this.size / 2, -this.size / 2);
        ctx.lineTo(this.size / 2, 0);
        ctx.lineTo(0, this.size / 2);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
    }
}

class FloatingText {
    constructor(x, y, text, color) {
        this.x = x;
        this.y = y;
        this.text = text;
        this.color = color;
        this.alpha = 1.0;
        this.vy = -50;
    }

    update(dt) {
        this.y += this.vy * dt;
        this.alpha -= 1.2 * dt;
    }

    draw(ctx) {
        if (this.alpha <= 0) return;
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.font = 'bold 20px "PingFang SC", "Microsoft YaHei", sans-serif';
        ctx.fillStyle = this.color;
        ctx.textAlign = 'center';
        ctx.shadowColor = 'rgba(0,0,0,0.7)';
        ctx.shadowBlur = 4;
        ctx.fillText(this.text, this.x, this.y);
        ctx.restore();
    }
}

/**
 * ==========================================
 * 7. 射击判定、3帧打击顿帧 (Hit-Stop) 与炸裂生成逻辑
 * ==========================================
 */
function spawnSmallDebris(x, y, palette, count = 10) {
    for (let i = 0; i < count; i++) {
        const c = palette[i % palette.length];
        particles.push(new ShardParticle(x, y, c));
    }
}

/**
 * 当合法飞盘完成 3 帧 (0.05s) Hit-Stop 定格后调用：
 * 1. 生成 4 块扇形几何裂片向外旋转飞散；
 * 2. 生成 1 圈极细半透明冲击波圆环；
 * 3. 生成发光战利品词条胶囊飞向对应玩家的侧边栏卡槽。
 */
function shatterDiscAfterHitStop(disc) {
    // 1. 分裂成 4 块扇形几何碎片
    for (let q = 0; q < 4; q++) {
        discSectorShards.push(new DiscSectorShard(disc, q));
    }

    // 2. 补充少量细小棱角碎屑增强层次
    const shardColors = disc.themeVariant === 0
        ? ['#eab308', '#14b8a6', '#fef08a']
        : ['#f97316', '#ea580c', '#2dd4bf'];
    spawnSmallDebris(disc.x, disc.y, shardColors, 10);

    // 3. 在击中点扩散出一圈极细半透明冲击波圆环
    shockwaveRings.push(new ShockwaveRing(disc.x, disc.y));

    // 4. 生成发光的合成词胶囊标签（如 [电脑 +10]）飞向对应玩家的侧边栏收集槽
    if (disc.hitByPlayerIndex >= 0) {
        flyingTokens.push(
            new FlyingPhraseToken(disc.x, disc.y, disc.fullWord, disc.hitByPlayerIndex)
        );
    }
}

function triggerFire(playerIndex) {
    const p = players[playerIndex];
    if (p.cooldown > 0) return;

    // 触发 0.1 秒极轻微、干脆的向外扩张开火脉冲
    p.firePulse = 1.0;

    for (let i = frisbees.length - 1; i >= 0; i--) {
        const f = frisbees[i];
        // 已经在定格待炸裂中的飞盘不再重复判定
        if (f.hitStopFrames > 0) continue;

        const dx = p.x - f.x;
        const dy = p.y - f.y;
        const dist = Math.hypot(dx, dy);

        if (dist <= f.radius + 4) {
            if (f.isValid) {
                // 【核心机制 1：打击顿帧 Hit-Stop】
                // 击中合法飞盘瞬间，让该飞盘硬性定格 3 帧 (约 0.05 秒)，随后再炸开！
                f.hitStopFrames = 3;
                f.hitStopTimer = 0.05;
                f.hitByPlayerIndex = playerIndex;
            } else {
                // 击中干扰飞盘：进入灰色冷却惩罚，同时分裂为 4 块金属扇形碎片与冲击波环
                p.cooldown = p.maxCooldown;
                for (let q = 0; q < 4; q++) {
                    discSectorShards.push(new DiscSectorShard(f, q));
                }
                shockwaveRings.push(new ShockwaveRing(f.x, f.y));
                spawnSmallDebris(f.x, f.y, ['#475569', '#eab308', '#1e293b'], 8);
                floatingTexts.push(
                    new FloatingText(f.x, f.y - 10, `✗ 误击干扰词【${f.char}】 卡壳冷却!`, '#f87171')
                );
                frisbees.splice(i, 1);
            }
            break;
        }
    }
}

/**
 * ==========================================
 * 8. 渲染函数：HUD、左右垂直战利品收集框 (Collection Racks) 与双人准星
 * ==========================================
 */
function drawCollectionRack(ctx, playerIndex) {
    const p = players[playerIndex];
    const geo = getPlayerRackGeometry(playerIndex);
    const { rackX, rackY, rackW, rackH } = geo;

    ctx.save();

    // 1. 垂直收集框外发光与半透明霓虹工业底板 (复刻设计图 03 P1/P2 垂直收集框)
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 14;
    ctx.fillStyle = 'rgba(15, 23, 42, 0.82)';
    ctx.strokeStyle = p.color;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.roundRect(rackX, rackY, rackW, rackH, 10);
    ctx.fill();
    ctx.stroke();

    // 内部彩色微光涂层
    ctx.shadowBlur = 0;
    ctx.fillStyle = p.rackBg;
    ctx.beginPath();
    ctx.roundRect(rackX + 3, rackY + 3, rackW - 6, rackH - 6, 8);
    ctx.fill();

    // 四角工业金属铆钉装饰
    const rivetOffsets = [
        [rackX + 8, rackY + 8],
        [rackX + rackW - 8, rackY + 8],
        [rackX + 8, rackY + rackH - 8],
        [rackX + rackW - 8, rackY + rackH - 8]
    ];
    rivetOffsets.forEach(([rx, ry]) => {
        ctx.beginPath();
        ctx.arc(rx, ry, 2.2, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
    });

    // 顶部收集框小标题
    ctx.fillStyle = p.accentColor;
    ctx.font = 'bold 11px "PingFang SC", monospace';
    ctx.textAlign = 'center';
    ctx.fillText(`${p.name} 词组收集槽 (${p.collectedWords.length}/${RACK_SLOT_COUNT})`, rackX + rackW / 2, rackY + 19);

    // 2. 绘制 4 个垂直卡槽 (空槽显示虚线框与 01 EMPTY，已收集槽显示点亮的词条卡牌)
    for (let i = 0; i < RACK_SLOT_COUNT; i++) {
        const slotRect = geo.getSlotRect(i);
        const collectedItem = p.collectedWords[i];

        if (!collectedItem) {
            // 绘制虚线空卡槽
            ctx.save();
            ctx.strokeStyle = playerIndex === 0 ? 'rgba(250, 204, 21, 0.35)' : 'rgba(217, 70, 239, 0.35)';
            ctx.fillStyle = 'rgba(9, 13, 22, 0.35)';
            ctx.lineWidth = 1.2;
            ctx.setLineDash([5, 4]);
            ctx.beginPath();
            ctx.roundRect(slotRect.x, slotRect.y, slotRect.w, slotRect.h, 6);
            ctx.fill();
            ctx.stroke();

            ctx.setLineDash([]);
            ctx.fillStyle = playerIndex === 0 ? 'rgba(254, 240, 138, 0.42)' : 'rgba(245, 208, 254, 0.42)';
            ctx.font = 'bold 12px monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(`0${i + 1} EMPTY`, slotRect.x + slotRect.w / 2, slotRect.y + slotRect.h / 2);
            ctx.restore();
        } else {
            // 绘制已点亮的合成词胶囊卡牌
            ctx.save();
            ctx.translate(slotRect.x + slotRect.w / 2, slotRect.y + slotRect.h / 2);
            const popScale = 1.0 + collectedItem.flash * 0.08;
            ctx.scale(popScale, popScale);
            drawPhraseBadgeGraphic(ctx, slotRect.w, slotRect.h - 2, collectedItem.word, playerIndex, collectedItem.flash);
            ctx.restore();
        }
    }

    ctx.restore();
}

function drawHUD(ctx) {

    ctx.save();
    ctx.fillStyle = '#94a3b8';
    ctx.font = '13px "PingFang SC", sans-serif';

    ctx.fillText('请射击能与下方母字组成合法词语的飞盘', centerX, 24);

    ctx.fillStyle = '#1e293b';
    ctx.strokeStyle = '#eab308';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.roundRect(centerX - 65, topY - 24, 130, 62, 12);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#fef08a';
    ctx.font = 'bold 36px "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.textBaseline = 'middle';
    ctx.fillText(`【${activeWordBank.base}】`, centerX, topY + 8);
    ctx.restore();

    // 绘制 P1 / P2 顶部计分板与下方垂直战利品收集框
    players.forEach((p, idx) => {

        const boxY = 66;

        ctx.strokeStyle = p.cooldown > 0 ? '#64748b' : p.color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(boxX, boxY, boxW, 56, 8);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = p.cooldown > 0 ? '#94a3b8' : p.color;
        ctx.font = 'bold 17px sans-serif';
        ctx.textAlign = 'left';
        const modeTag = p.hasJoyCon ? '🎮' : '';
        ctx.fillText(`${p.name} ${modeTag}`, boxX + 12, boxY + 23);

        ctx.fillStyle = '#f8fafc';
        ctx.font = 'bold 22px monospace';
        ctx.textAlign = 'right';
        ctx.fillText(`${p.score}`, boxX + boxW - 12, boxY + 25);

        ctx.fillStyle = p.cooldown > 0 ? '#94a3b8' : '#64748b';
        ctx.font = '11px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(
            p.cooldown > 0 ? `卡壳冷却 ${p.cooldown.toFixed(1)}s` : (p.hasJoyCon ? `体感 ${CONFIG.reticleSensitivity.toFixed(1)}x 就绪` : '状态: 就绪'),
            boxX + 12,
            boxY + 44
        );
        ctx.restore();

        // 绘制侧边栏垂直收集框
        drawCollectionRack(ctx, idx);
    });
}

function drawCrosshair(ctx, p) {
    ctx.save();
    ctx.translate(p.x, p.y);

    const isCooling = p.cooldown > 0;
    const pulseOffset = isCooling ? 0 : p.firePulse * 4.5;

    const mainColor = isCooling ? '#64748b' : p.color;
    const subColor = isCooling ? '#475569' : p.accentColor;

    ctx.globalAlpha = isCooling ? 0.52 : 1.0;
    if (!isCooling) {
        ctx.shadowColor = p.color;
        ctx.shadowBlur = p.firePulse > 0 ? 14 : 6;
    }

    if (p.id === 1) {
        const outerR = 30 + pulseOffset;
        const innerR = 25 + pulseOffset * 0.7;

        ctx.strokeStyle = 'rgba(9, 13, 22, 0.75)';
        ctx.lineWidth = 3.2;
        ctx.beginPath();
        ctx.arc(0, 0, outerR, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = mainColor;
        ctx.lineWidth = 2.0;
        const gapAngle = 0.16;
        for (let i = 0; i < 4; i++) {
            const startA = i * (Math.PI / 2) + gapAngle;
            const endA = (i + 1) * (Math.PI / 2) - gapAngle;
            ctx.beginPath();
            ctx.arc(0, 0, outerR, startA, endA);
            ctx.stroke();
        }

        ctx.strokeStyle = subColor;
        ctx.lineWidth = 0.9;
        for (let i = 0; i < 4; i++) {
            const startA = i * (Math.PI / 2) + gapAngle * 1.4;
            const endA = (i + 1) * (Math.PI / 2) - gapAngle * 1.4;
            ctx.beginPath();
            ctx.arc(0, 0, innerR, startA, endA);
            ctx.stroke();
        }

        ctx.fillStyle = mainColor;
        ctx.strokeStyle = '#090d16';
        ctx.lineWidth = 1;
        for (let i = 0; i < 4; i++) {
            ctx.save();
            ctx.rotate(i * (Math.PI / 2));
            ctx.beginPath();
            ctx.moveTo(-2.8, -(outerR + 3));
            ctx.lineTo(2.8, -(outerR + 3));
            ctx.lineTo(1.5, -(innerR - 4));
            ctx.lineTo(-1.5, -(innerR - 4));
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.restore();
        }

        ctx.strokeStyle = subColor;
        ctx.lineWidth = 0.85;
        const axisStart = 5;
        const axisEnd = innerR - 6;

        for (let i = 0; i < 4; i++) {
            ctx.save();
            ctx.rotate(i * (Math.PI / 2));
            ctx.beginPath();
            ctx.moveTo(0, -axisStart);
            ctx.lineTo(0, -axisEnd);
            ctx.stroke();

            for (let r = 8; r <= axisEnd - 2; r += 3.5) {
                const tickHalfW = (r === 15) ? 2.6 : 1.3;
                ctx.beginPath();
                ctx.moveTo(-tickHalfW, -r);
                ctx.lineTo(tickHalfW, -r);
                ctx.stroke();
            }
            ctx.restore();
        }

        ctx.strokeStyle = mainColor;
        ctx.lineWidth = 1.1;
        ctx.beginPath();
        ctx.moveTo(-2.2, 0); ctx.lineTo(2.2, 0);
        ctx.moveTo(0, -2.2); ctx.lineTo(0, 2.2);
        ctx.stroke();

        if (p.firePulse > 0 && !isCooling) {
            ctx.save();
            ctx.globalAlpha = p.firePulse;
            ctx.strokeStyle = '#fef08a';
            ctx.lineWidth = 1.4;

            const pulseRingR = outerR + 5 + (1 - p.firePulse) * 6;
            ctx.beginPath();
            ctx.arc(0, 0, pulseRingR, -Math.PI * 0.38, Math.PI * 0.22);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(0, 0, pulseRingR, Math.PI * 0.62, Math.PI * 1.22);
            ctx.stroke();

            const sparkAngles = [-0.65, -0.45, 2.35, 2.6];
            sparkAngles.forEach(a => {
                ctx.beginPath();
                ctx.moveTo(Math.cos(a) * (innerR - 4), Math.sin(a) * (innerR - 4));
                ctx.lineTo(Math.cos(a) * (pulseRingR + 6), Math.sin(a) * (pulseRingR + 6));
                ctx.stroke();
            });
            ctx.restore();
        }

    } else {
        const outerD = 33 + pulseOffset;
        const innerD = 26 + pulseOffset * 0.7;

        ctx.strokeStyle = 'rgba(9, 13, 22, 0.8)';
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.moveTo(0, -outerD);
        ctx.lineTo(outerD, 0);
        ctx.lineTo(0, outerD);
        ctx.lineTo(-outerD, 0);
        ctx.closePath();
        ctx.stroke();

        ctx.strokeStyle = mainColor;
        ctx.lineWidth = 2.0;
        ctx.beginPath();
        ctx.moveTo(0, -outerD);
        ctx.lineTo(outerD, 0);
        ctx.lineTo(0, outerD);
        ctx.lineTo(-outerD, 0);
        ctx.closePath();
        ctx.stroke();

        ctx.strokeStyle = subColor;
        ctx.lineWidth = 0.9;
        ctx.beginPath();
        ctx.moveTo(0, -innerD);
        ctx.lineTo(innerD, 0);
        ctx.lineTo(0, innerD);
        ctx.lineTo(-innerD, 0);
        ctx.closePath();
        ctx.stroke();

        ctx.fillStyle = mainColor;
        ctx.strokeStyle = '#090d16';
        ctx.lineWidth = 0.9;
        for (let i = 0; i < 4; i++) {
            ctx.save();
            ctx.rotate(i * (Math.PI / 2));
            ctx.beginPath();
            ctx.moveTo(0, -(outerD + 2));
            ctx.lineTo(3.2, -(innerD - 1));
            ctx.lineTo(0, -(innerD - 6));
            ctx.lineTo(-3.2, -(innerD - 1));
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.restore();
        }

        ctx.strokeStyle = subColor;
        ctx.lineWidth = 0.85;
        const axisStart = 4.5;
        const axisEnd = innerD - 7;
        for (let i = 0; i < 4; i++) {
            ctx.save();
            ctx.rotate(i * (Math.PI / 2));
            ctx.beginPath();
            ctx.moveTo(0, -axisStart);
            ctx.lineTo(0, -axisEnd);
            ctx.stroke();

            for (let r = 8; r <= axisEnd - 2; r += 4) {
                ctx.beginPath();
                ctx.moveTo(-1.4, -r);
                ctx.lineTo(1.4, -r);
                ctx.stroke();
            }
            ctx.restore();
        }

        ctx.fillStyle = mainColor;
        ctx.beginPath();
        ctx.arc(0, 0, 1.5, 0, Math.PI * 2);
        ctx.fill();

        if (p.firePulse > 0 && !isCooling) {
            ctx.save();
            ctx.globalAlpha = p.firePulse;
            ctx.strokeStyle = '#f5d0fe';
            ctx.lineWidth = 1.5;

            const flareLen = outerD + 8 + (1 - p.firePulse) * 6;
            ctx.beginPath();
            ctx.moveTo(-flareLen * 0.75, -flareLen * 0.75);
            ctx.lineTo(flareLen * 0.75, flareLen * 0.75);
            ctx.moveTo(flareLen * 0.75, -flareLen * 0.75);
            ctx.lineTo(-flareLen * 0.75, flareLen * 0.75);
            ctx.stroke();
            ctx.restore();
        }
    }

    if (!isCooling && p.isLocked) {
        ctx.save();
        const bracketDist = 34;
        const bracketLen = 8;
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 2.0;

        const corners = [
            [-1, -1], [1, -1], [1, 1], [-1, 1]
        ];
        corners.forEach(([sx, sy]) => {
            const cx = sx * bracketDist;
            const cy = sy * bracketDist;
            ctx.beginPath();
            ctx.moveTo(cx, cy - sy * bracketLen);
            ctx.lineTo(cx, cy);
            ctx.lineTo(cx - sx * bracketLen, cy);
            ctx.stroke();
        });

        ctx.save();
        ctx.translate(26, 26);
        ctx.rotate(-0.12);
        ctx.font = '900 italic 12px "Arial Black", sans-serif';
        ctx.lineJoin = 'round';
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#090d16';
        ctx.strokeText('LOCK!', 0, 0);
        ctx.fillStyle = p.accentColor;
        ctx.fillText('LOCK!', 0, 0);
        ctx.restore();

        ctx.restore();
    }

    if (isCooling) {
        ctx.save();
        ctx.globalAlpha = 0.92;
        const arcRadius = 39;
        const remainingRatio = Math.max(0, Math.min(1, p.cooldown / p.maxCooldown));

        ctx.strokeStyle = 'rgba(51, 65, 85, 0.55)';
        ctx.lineWidth = 2.0;
        ctx.beginPath();
        ctx.arc(0, 0, arcRadius, 0, Math.PI * 2);
        ctx.stroke();

        const startAngle = -Math.PI / 2 + Math.PI * 2 * (1 - remainingRatio);
        const endAngle = -Math.PI / 2 + Math.PI * 2;

        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 3.0;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.arc(0, 0, arcRadius, startAngle, endAngle, false);
        ctx.stroke();

        ctx.fillStyle = '#94a3b8';
        ctx.font = 'bold 11px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(`JAMMED ${p.cooldown.toFixed(1)}s`, 0, arcRadius + 14);
        ctx.restore();
    } else {
        ctx.save();
        ctx.shadowBlur = 0;
        ctx.font = '900 11px sans-serif';
        ctx.textAlign = 'left';
        ctx.lineWidth = 3;
        ctx.strokeStyle = '#090d16';
        ctx.strokeText(p.name, 26, -22);
        ctx.fillStyle = mainColor;
        ctx.fillText(p.name, 26, -22);
        ctx.restore();
    }

    ctx.restore();
}

/**
 * ==========================================
 * 9. 主循环与交互事件初始化
 * ==========================================
 */
let lastTime = 0;
let spawnTimer = 0;

function resizeCanvas() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
}

function isTypingInInput() {
    const el = document.activeElement;
    return el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA');
}

function initUIEvents() {
    const settingsPanel = document.getElementById('settings-panel');
    const toggleBtn = document.getElementById('btn-toggle-settings');

    toggleBtn.addEventListener('click', () => {
        const isCollapsed = settingsPanel.classList.toggle('collapsed');
        toggleBtn.innerText = isCollapsed ? '⚙️ 设置' : '✖️ 收起设置';
    });

    const sliderSpeed = document.getElementById('slider-speed');
    const valSpeed = document.getElementById('val-speed');
    sliderSpeed.addEventListener('input', (e) => {
        CONFIG.speedScale = parseFloat(e.target.value);
        valSpeed.innerText = `${CONFIG.speedScale.toFixed(2)}x`;
    });

    const sliderDamping = document.getElementById('slider-damping');
    const valDamping = document.getElementById('val-damping');
    sliderDamping.addEventListener('input', (e) => {
        CONFIG.apexDamping = parseFloat(e.target.value);
        valDamping.innerText = `${Math.round(CONFIG.apexDamping * 100)}%`;
    });

    const sliderInterval = document.getElementById('slider-interval');
    const valInterval = document.getElementById('val-interval');
    sliderInterval.addEventListener('input', (e) => {
        CONFIG.spawnInterval = parseFloat(e.target.value);
        valInterval.innerText = `${CONFIG.spawnInterval.toFixed(1)}s`;
    });

    const sliderReticleSens = document.getElementById('slider-reticle-sens');
    const valReticleSens = document.getElementById('val-reticle-sens');
    sliderReticleSens.addEventListener('input', (e) => {
        CONFIG.reticleSensitivity = parseFloat(e.target.value);
        valReticleSens.innerText = `${CONFIG.reticleSensitivity.toFixed(1)}x`;
        syncReticleSensitivityToFilters();
    });

    const sliderGyroExp = document.getElementById('slider-gyro-exp');
    const valGyroExp = document.getElementById('val-gyro-exp');
    sliderGyroExp.addEventListener('input', (e) => {
        CONFIG.gyroAccelExponent = parseFloat(e.target.value);
        valGyroExp.innerText = CONFIG.gyroAccelExponent.toFixed(2);
    });

    document.getElementById('chk-invert-x').addEventListener('change', (e) => {
        CONFIG.invertGyroX = e.target.checked;
    });

    document.getElementById('chk-invert-y').addEventListener('change', (e) => {
        CONFIG.invertGyroY = e.target.checked;
    });

    const triggerAllRecenter = () => {
        recenterPlayerReticle(0, true);
        if (players[1].hasJoyCon) {
            recenterPlayerReticle(1, false);
        }
    };
    document.getElementById('btn-recenter').addEventListener('click', triggerAllRecenter);
    document.getElementById('btn-panel-recenter').addEventListener('click', triggerAllRecenter);

    document.querySelectorAll('.preset-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const idx = parseInt(btn.getAttribute('data-preset'), 10);
            loadPresetToForm(idx);
        });
    });

    document.getElementById('btn-apply-wordbank').addEventListener('click', () => {
        const baseVal = document.getElementById('input-base').value;
        const validVal = document.getElementById('input-valid').value;
        const invalidVal = document.getElementById('input-invalid').value;

        document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
        parseAndApplyWordBank(baseVal, validVal, invalidVal);
    });

    document.getElementById('btn-joycon').addEventListener('click', () => {
        joyconManager.requestConnection();
    });

    document.getElementById('btn-word').addEventListener('click', () => {
        const nextIdx = (currentPresetIdx + 1) % PRESET_LEVELS.length;
        loadPresetToForm(nextIdx);
    });
}

function init() {
    canvas = document.getElementById('gameCanvas');
    ctx = canvas.getContext('2d');
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    loadPresetToForm(0);
    initUIEvents();
    syncReticleSensitivityToFilters();

    players[0].x = players[0].rawX = width * 0.35;
    players[0].y = players[0].rawY = height * 0.5;
    players[0].filterX.reset(players[0].x);
    players[0].filterY.reset(players[0].y);

    players[1].x = players[1].rawX = width * 0.65;
    players[1].y = players[1].rawY = height * 0.5;
    players[1].filterX.reset(players[1].x);
    players[1].filterY.reset(players[1].y);

    frisbees.push(new Frisbee());

    window.addEventListener('mousemove', (e) => {
        if (!players[0].hasJoyCon) {
            players[0].x = players[0].rawX = e.clientX;
            players[0].y = players[0].rawY = e.clientY;
        }
    });

    window.addEventListener('mousedown', (e) => {
        if (e.target.closest('#settings-wrapper') || e.target.closest('#ui-bar')) {
            return;
        }
        if (e.button === 0) {
            triggerFire(0);
        }
    });

    window.addEventListener('keydown', (e) => {
        if (isTypingInInput()) return;

        const k = e.key.toLowerCase();
        if (k in keys) keys[k] = true;
        if (e.code === 'Space' && !e.repeat) {
            e.preventDefault();
            triggerFire(1);
        }
    });

    window.addEventListener('keyup', (e) => {
        const k = e.key.toLowerCase();
        if (k in keys) keys[k] = false;
    });

    requestAnimationFrame(gameLoop);
}

function update(dt) {
    spawnTimer += dt;
    if (spawnTimer >= CONFIG.spawnInterval) {
        spawnTimer = 0;
        frisbees.push(new Frisbee());
        if (Math.random() < 0.25) {
            frisbees.push(new Frisbee());
        }
    }

    const p2 = players[1];
    if (!p2.hasJoyCon) {
        if (keys.w) p2.y -= P2_SPEED * dt;
        if (keys.s) p2.y += P2_SPEED * dt;
        if (keys.a) p2.x -= P2_SPEED * dt;
        if (keys.d) p2.x += P2_SPEED * dt;
        p2.x = p2.rawX = Math.max(0, Math.min(width, p2.x));
        p2.y = p2.rawY = Math.max(0, Math.min(height, p2.y));
    }

    players.forEach(p => {
        if (p.cooldown > 0) {
            p.cooldown = Math.max(0, p.cooldown - dt);
        }
        if (p.firePulse > 0) {
            p.firePulse = Math.max(0, p.firePulse - dt * 10);
        }
        // 更新已收集词条卡槽的高亮脉冲衰减
        p.collectedWords.forEach(item => {
            if (item.flash > 0) {
                item.flash = Math.max(0, item.flash - dt * 3.2);
            }
        });
        // 检测准星是否锁定合法飞盘
        p.isLocked = frisbees.some(f => f.isValid && f.hitStopFrames === 0 && Math.hypot(p.x - f.x, p.y - f.y) <= f.radius + 4);
    });

    // 更新飞盘 (含 3 帧 Hit-Stop 定格倒计时)
    for (let i = frisbees.length - 1; i >= 0; i--) {
        frisbees[i].update(dt);
        if (frisbees[i].markedForDeletion) {
            frisbees.splice(i, 1);
        }
    }

    // 更新 4 扇形几何飞盘碎片
    for (let i = discSectorShards.length - 1; i >= 0; i--) {
        discSectorShards[i].update(dt);
        if (discSectorShards[i].alpha <= 0) {
            discSectorShards.splice(i, 1);
        }
    }

    // 更新极细冲击波圆环
    for (let i = shockwaveRings.length - 1; i >= 0; i--) {
        shockwaveRings[i].update(dt);
        if (shockwaveRings[i].life >= shockwaveRings[i].duration) {
            shockwaveRings.splice(i, 1);
        }
    }

    // 更新战利品合成词胶囊飞行动画
    for (let i = flyingTokens.length - 1; i >= 0; i--) {
        flyingTokens[i].update(dt);
        if (flyingTokens[i].finished) {
            flyingTokens.splice(i, 1);
        }
    }

    // 更新细微边角碎屑粒子
    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update(dt);
        if (particles[i].alpha <= 0) {
            particles.splice(i, 1);
        }
    }

    // 更新漂浮文字
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        floatingTexts[i].update(dt);
        if (floatingTexts[i].alpha <= 0) {
            floatingTexts.splice(i, 1);
        }
    }
}

function draw() {
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(0, 0, width, height);

    // 底部左右发射台几何示意
    ctx.fillStyle = '#1e293b';
    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, height - 40, 35, -Math.PI / 2, Math.PI / 2);
    ctx.fill();
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(width, height - 40, 35, Math.PI / 2, -Math.PI / 2);
    ctx.fill();
    ctx.stroke();

    // 1. 绘制顶部母字、计分板与左右侧边栏垂直收集框
    drawHUD(ctx);

    // 2. 绘制极细半透明冲击波圆环
    shockwaveRings.forEach(ring => ring.draw(ctx));

    // 3. 绘制飞盘 (含处于 3 帧 Hit-Stop 裂纹定格态的飞盘)
    frisbees.forEach(f => f.draw(ctx));

    // 4. 绘制分裂飞散的 4 扇形几何碎片与细小碎屑
    discSectorShards.forEach(s => s.draw(ctx));
    particles.forEach(p => p.draw(ctx));

    // 5. 绘制飞向战利品卡槽的合成词胶囊与提示文字
    flyingTokens.forEach(token => token.draw(ctx));
    floatingTexts.forEach(t => t.draw(ctx));

    // 6. 最顶层绘制 P1 / P2 战术准星
    players.forEach(p => drawCrosshair(ctx, p));
}

function gameLoop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const dt = Math.min((timestamp - lastTime) / 1000, 0.1);
    lastTime = timestamp;

    update(dt);
    draw();

    requestAnimationFrame(gameLoop);
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
